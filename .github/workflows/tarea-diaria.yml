# LAS TAREAS DIARIAS, DISPARADAS DESDE GITHUB.
#
# vercel.json ya declara los dos crons, pero en el plan Hobby de Vercel un cron
# puede no dispararse durante días sin que nadie se entere (le pasó al bot de
# Parques del Recuerdo). Esta Action llama a los mismos endpoints a la misma
# hora: si Vercel dispara, la tarea corre dos veces y no pasa nada (las dos
# son idempotentes); si no dispara, corre igual. Y de paso pregunta por la
# salud de la copia con ?alertar=si, para que un fallo le suene al operador.
#
# Necesita dos cosas en GitHub → Settings → Secrets and variables → Actions:
#   secreto  CRON_SECRET   el mismo valor que tiene la copia en Vercel
#   variable SITIO_URL     https://www.intellectum.ec (o el dominio de la copia)
#
# Una copia por cliente = un repo (o una rama) por cliente con sus propios
# secretos. El workflow es el mismo.

name: Tareas diarias

on:
  schedule:
    - cron: "5 12 * * *"  # 07:05 Ecuador: recordatorios, retención, respaldo (domingos)
    - cron: "5 15 * * *"  # 10:05 Ecuador: seguimientos
  workflow_dispatch:

jobs:
  llamar:
    runs-on: ubuntu-latest
    env:
      SITIO: ${{ vars.SITIO_URL || 'https://www.intellectum.ec' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Comprobar que hay clave
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub." >&2
            exit 1
          fi

      - name: Recordatorios (mañana)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 12 * * *'
        run: |
          codigo=$(curl -sS -o respuesta.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$SITIO/api/recordatorios")
          echo "recordatorios → $codigo"; cat respuesta.txt; echo
          [ "$codigo" = "200" ] || [ "$codigo" = "503" ]

      - name: Seguimientos (media mañana)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 15 * * *'
        run: |
          codigo=$(curl -sS -o respuesta.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$SITIO/api/seguimientos")
          echo "seguimientos → $codigo"; cat respuesta.txt; echo
          [ "$codigo" = "200" ]

      - name: Salud (avisa al operador si algo falla)
        run: |
          codigo=$(curl -sS -o salud.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$SITIO/api/salud?alertar=si")
          echo "salud → $codigo"; cat salud.txt; echo
          # Un 503 aquí no tumba la Action: el aviso ya salió por lib/alertas.js.
          [ "$codigo" = "200" ] || [ "$codigo" = "503" ]
