<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel — Intellectum</title>

<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --bg: #08090b; --bg-elev: #0d0f12; --bg-card: rgba(255,255,255,0.02);
  --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.15);
  --text: #f7f8f8; --text-dim: #a6adb0; --text-muted: #737d81;
  --accent: #22d3ee; --accent-bright: #67e8f9;
  --accent-tint-bg: rgba(34,211,238,0.08); --accent-tint-border: rgba(34,211,238,0.22);
  --verde: #4ade80; --ambar: #fbbf24; --rojo: #f87171;
  --font-display: "Fraunces", Georgia, serif;
  --font-sans: "Geist", -apple-system, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --radius: 14px; --radius-lg: 20px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: rgba(255,255,255,0.14) transparent; }
/* Las superficies del navegador también llevan el diseño. */
::selection { background: var(--accent); color: #06141a; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
/* Los botones responden al tacto. */
.tab, .estado-btn, .nota-zona button, .acceso-caja button, .chatp-fila button,
.btn-cancelar, .confirma-zona .si, .confirma-zona .no, .fila-chat, .salir {
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.tab:active, .estado-btn:active, .nota-zona button:active, .acceso-caja button:active,
.chatp-fila button:active, .btn-cancelar:active, .confirma-zona .si:active,
.confirma-zona .no:active, .fila-chat:active, .salir:active { transform: scale(0.97); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 15.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
input, textarea, select { font: inherit; color: inherit; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,211,238,0.08), transparent 60%);
}

/* ── acceso ── */
.acceso {
  min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  position: relative; z-index: 1;
}
.acceso-caja {
  width: 100%; max-width: 400px; padding: 34px 28px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg);
}
.acceso-caja h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 14px 0 6px; }
.acceso-caja .marca { display: flex; align-items: center; gap: 10px; }
.acceso-caja .marca img { height: 30px; width: auto; }
.acceso-caja p { color: var(--text-dim); font-size: 14px; margin: 0 0 22px; }
.acceso-caja input {
  width: 100%; padding: 13px 15px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.acceso-caja input:focus { outline: none; border-color: var(--accent); }
.acceso-caja button {
  width: 100%; margin-top: 12px; padding: 13px; border-radius: 999px;
  background: var(--accent); color: #06141a; font-weight: 600;
}
.acceso-caja button:hover { background: var(--accent-bright); }
.acceso-error { color: var(--rojo); font-size: 13.5px; margin-top: 12px; display: none; }

/* ── estructura ── */
.app { display: none; position: relative; z-index: 1; min-height: 100dvh; padding-bottom: 76px; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 12px clamp(14px, 3vw, 28px);
  background: rgba(8,9,11,0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar img { height: 26px; width: auto; }
.topbar .titulo { font-family: var(--font-display); font-size: 18px; }
.topbar .espacio { flex: 1; }
.topbar .salir { color: var(--text-muted); font-size: 13px; }
.topbar .salir:hover { color: var(--text); }

.lienzo { max-width: 860px; margin: 0 auto; padding: 18px clamp(14px, 3vw, 28px) 30px; }

/* pestañas: abajo en móvil, arriba en escritorio */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-around;
  background: rgba(13,15,18,0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 10px; border-radius: 10px; color: var(--text-muted); font-size: 10.5px;
  letter-spacing: 0.02em;
}
.tab svg { width: 21px; height: 21px; }
.tab.activa { color: var(--accent); }
@media (min-width: 760px) {
  .app { padding-bottom: 0; }
  .tabs {
    position: sticky; top: 51px; bottom: auto; justify-content: flex-start; gap: 4px;
    border-top: 0; border-bottom: 1px solid var(--border); padding: 8px clamp(14px, 3vw, 28px);
  }
  .tab { flex-direction: row; gap: 7px; font-size: 13.5px; padding: 8px 14px; }
  .tab.activa { background: var(--accent-tint-bg); }
  .tab svg { width: 17px; height: 17px; }
}

.vista { display: none; }
.vista.activa { display: block; }
.cargando { color: var(--text-muted); text-align: center; padding: 40px 0; font-size: 14px; }

h2.seccion { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 22px 0 12px; }

/* ── tarjetas y listas ── */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat {
  padding: 16px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card);
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}
.stat[data-ir] { cursor: pointer; }
.stat[data-ir]:hover { border-color: var(--accent-tint-border); background: var(--accent-tint-bg); transform: translateY(-1px); }
.tarjeta[data-ir] { cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.tarjeta[data-ir]:hover { border-color: var(--accent-tint-border); background: var(--accent-tint-bg); }

.act-fila {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px; border-radius: 12px; margin: 2px 0;
}
.act-fila[data-ir] { cursor: pointer; }
.act-fila[data-ir]:hover { background: var(--accent-tint-bg); }
.act-icono {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: var(--bg-card); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 16px;
}
.act-texto { font-size: 13.5px; color: var(--text-dim); }
.act-cuando { margin-left: auto; color: var(--text-muted); font-size: 11.5px; white-space: nowrap; padding-left: 8px; }
.stat .num { font-family: var(--font-display); font-size: 30px; line-height: 1.1; color: var(--accent); }
.stat .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.tarjeta {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
  padding: 15px 16px; margin-bottom: 10px;
}
.tarjeta .fila1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tarjeta .nombre { font-weight: 500; }
.tarjeta .cuando { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.tarjeta .detalle { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
.tarjeta .contacto { font-size: 13.5px; margin-top: 6px; word-break: break-all; }

.pastilla {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px;
  border: 1px solid var(--border-strong); color: var(--text-dim); letter-spacing: 0.03em;
}
.pastilla.alta { border-color: rgba(248,113,113,0.4); color: var(--rojo); }
.pastilla.media { border-color: rgba(251,191,36,0.4); color: var(--ambar); }
.pastilla.canal { border-color: var(--accent-tint-border); color: var(--accent); }
.pastilla.riesgo { border-color: rgba(251,191,36,0.5); color: var(--ambar); background: rgba(251,191,36,0.06); }

.alerta-riesgo {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  padding: 12px 15px; border-radius: var(--radius); font-size: 13.5px;
  border: 1px solid rgba(251,191,36,0.35); background: rgba(251,191,36,0.06);
  color: var(--ambar); cursor: pointer; transition: background 0.2s;
}
.alerta-riesgo:hover { background: rgba(251,191,36,0.12); }

.cita-pie { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.cita-pie .codigo { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); }
.btn-cancelar {
  margin-left: auto; padding: 5px 12px; border-radius: 999px; font-size: 12px;
  border: 1px solid rgba(248,113,113,0.35); color: var(--rojo);
}
.btn-cancelar:hover { background: rgba(248,113,113,0.08); }
.confirma-zona {
  margin-top: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px;
  border: 1px solid rgba(248,113,113,0.3); background: rgba(248,113,113,0.05);
  color: var(--text-dim);
}
.confirma-zona .botones { display: flex; gap: 8px; margin-top: 10px; }
.confirma-zona .si {
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--rojo); color: #1a0606;
}
.confirma-zona .no {
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border-strong); color: var(--text-dim);
}
.cita-resultado { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); }

.cita-pie .btn-mover {
  margin-left: auto; padding: 5px 12px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--accent-tint-border); color: var(--accent);
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.cita-pie .btn-mover:hover { background: var(--accent-tint-bg); }
.cita-pie .btn-mover:active { transform: scale(0.97); }
.cita-pie .btn-mover + .btn-cancelar { margin-left: 0; }
.horas-zona {
  margin-top: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px;
  border: 1px solid var(--accent-tint-border); background: var(--accent-tint-bg);
  color: var(--text-dim);
}
.horas-zona .opciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hora-op {
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--accent-tint-border); color: var(--accent);
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.hora-op:hover { background: rgba(34,211,238,0.14); }
.hora-op:active { transform: scale(0.97); }
.hora-op:disabled { opacity: 0.55; cursor: default; }
.hora-op.quieta { border-color: var(--border-strong); color: var(--text-dim); }
.hora-op.quieta:hover { background: rgba(255,255,255,0.05); }

.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 14px; }
.chip-filtro {
  padding: 5px 12px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--border); color: var(--text-muted);
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.chip-filtro:active { transform: scale(0.97); }
.chip-filtro.activo { border-color: var(--accent); color: var(--accent); background: var(--accent-tint-bg); }

.etiquetas-zona { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.pastilla.etiqueta { display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--border-strong); color: var(--text-dim); }
.pastilla.etiqueta .quitar { padding: 0 2px; color: var(--text-muted); font-size: 13px; line-height: 1; }
.pastilla.etiqueta .quitar:hover { color: var(--rojo); }
.etiqueta-nueva { width: 110px; padding: 4px 10px; border-radius: 999px; font-size: 12px;
  background: none; border: 1px dashed var(--border-strong); color: var(--text-dim); }
.etiqueta-nueva:focus { outline: none; border-style: solid; border-color: var(--accent); }
.etiqueta-nueva::placeholder { color: var(--text-muted); }

.valor-zona { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
.valor-zona .moneda { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }
.valor-input { width: 130px; padding: 5px 10px; border-radius: 8px; font-size: 13px;
  font-family: var(--font-mono); background: var(--bg-card);
  border: 1px solid var(--border); color: var(--text); }
.valor-input:focus { outline: none; border-color: var(--accent); }
.valor-input::placeholder { color: var(--text-muted); font-family: var(--font-sans); }
.motivo-txt { color: var(--text-muted); font-size: 12.5px; }

.motivo-zona {
  margin-top: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px;
  border: 1px solid var(--border-strong); background: rgba(255,255,255,0.03);
  color: var(--text-dim);
}
.motivo-zona .opciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.motivo-op {
  padding: 6px 13px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border-strong); color: var(--text-dim);
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.motivo-op:hover { border-color: var(--accent); color: var(--accent); }
.motivo-op:active { transform: scale(0.97); }
.motivo-otro { width: 150px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  background: none; border: 1px dashed var(--border-strong); color: var(--text-dim); }
.motivo-otro:focus { outline: none; border-style: solid; border-color: var(--accent); }

.estados { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.estado-btn {
  padding: 5px 12px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--border); color: var(--text-muted);
}
.estado-btn.activo { border-color: var(--accent); color: var(--accent); background: var(--accent-tint-bg); }
.estado-btn.ganado.activo { border-color: var(--verde); color: var(--verde); background: rgba(74,222,128,0.08); }
.estado-btn.perdido.activo { border-color: var(--rojo); color: var(--rojo); background: rgba(248,113,113,0.08); }

.nota-zona { margin-top: 10px; display: flex; gap: 8px; }
.nota-zona textarea {
  flex: 1; min-height: 38px; max-height: 110px; padding: 9px 12px; resize: vertical;
  border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 13.5px;
}
.nota-zona textarea:focus { outline: none; border-color: var(--accent); }
.nota-zona button {
  align-self: flex-end; padding: 9px 14px; border-radius: 10px; font-size: 13px;
  border: 1px solid var(--accent-tint-border); color: var(--accent);
}
.nota-zona button:hover { background: var(--accent-tint-bg); }

.buscador {
  width: 100%; padding: 12px 15px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-elev); margin-bottom: 14px;
}
.buscador:focus { outline: none; border-color: var(--accent); }

.fila-chat {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
  padding: 13px 15px; margin-bottom: 9px;
}
.fila-chat:hover { border-color: var(--accent-tint-border); }
.fila-chat .quien { font-weight: 500; font-size: 14px; }
.fila-chat .resumen { color: var(--text-muted); font-size: 12.5px; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.fila-chat .lado { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }

.volver { color: var(--text-dim); font-size: 13.5px; display: inline-flex; gap: 6px; margin-bottom: 12px; }
.burbujas { display: flex; flex-direction: column; gap: 10px; }
.burbuja {
  max-width: 86%; padding: 10px 14px; border-radius: 14px; font-size: 14px;
  white-space: pre-wrap; overflow-wrap: break-word;
}
.burbuja.cliente { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
.burbuja.bot { align-self: flex-end; background: var(--accent-tint-bg); border: 1px solid var(--accent-tint-border); border-bottom-right-radius: 5px; }
.burbuja.mano { background: rgba(255,255,255,0.05); border-color: var(--border-strong); }
.burbuja.mano::before {
  content: "Tú"; display: block; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;
}

/* El cajón para responder a mano una conversación de WhatsApp. */
.composer { display: flex; gap: 10px; align-items: flex-end; margin-top: 16px; }
.composer textarea {
  flex: 1; min-height: 44px; max-height: 140px; resize: none; padding: 11px 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font: inherit; font-size: 14px; line-height: 1.45;
  transition: border-color 0.18s;
}
.composer textarea:focus { outline: none; border-color: var(--border-strong); }
.composer textarea::placeholder { color: var(--text-muted); }
.composer .enviar-mano {
  flex-shrink: 0; padding: 11px 20px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: #06141a; font-weight: 500; font-size: 13.5px;
  transition: background 0.18s, transform 0.12s var(--ease-out, ease-out);
}
.composer .enviar-mano:active { transform: scale(0.97); }
.composer .enviar-mano:disabled { opacity: 0.55; cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .composer .enviar-mano:hover:not(:disabled) { background: var(--accent-bright, #67e8f9); }
}
.composer-nota { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.composer-nota.alerta { color: #fca5a5; }

.evento { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13.5px; min-width: 0; }
.evento span { overflow-wrap: anywhere; }
.evento .tipo { font-family: var(--font-mono); font-size: 11px; color: var(--accent); white-space: nowrap; padding-top: 2px; }
.evento .cuando { margin-left: auto; color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }

/* ── chat privado ── */
.chatp { display: flex; flex-direction: column; height: calc(100dvh - 240px); min-height: 320px; }
@media (min-width: 760px) { .chatp { height: calc(100dvh - 220px); } }
.chatp-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
.chatp-fila { display: flex; gap: 8px; align-items: flex-end; }
.chatp-fila textarea {
  flex: 1; resize: none; max-height: 120px; padding: 11px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-elev); font-size: 14.5px;
}
.chatp-fila textarea:focus { outline: none; border-color: var(--accent); }
.chatp-fila button {
  width: 42px; height: 42px; border-radius: var(--radius); flex: none;
  background: var(--accent); color: #06141a; display: grid; place-items: center;
}
.chatp-fila button:disabled { opacity: 0.4; }
.burbuja.yo { align-self: flex-end; background: var(--accent-tint-bg); border: 1px solid var(--accent-tint-border); border-bottom-right-radius: 5px; }
.burbuja.agente { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
.burbuja.aviso { align-self: center; background: none; border: 0; color: var(--text-muted); font-size: 12.5px; }
.sugerencias { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
.sugerencias button {
  padding: 8px 13px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border); color: var(--text-dim); background: var(--bg-card);
}
.sugerencias button:hover { border-color: var(--accent-tint-border); color: var(--text); }

.vacio { color: var(--text-muted); text-align: center; padding: 34px 10px; font-size: 14px; }
.puntitos i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); margin-right: 3px; animation: p 1.3s infinite; }
.puntitos i:nth-child(2) { animation-delay: .18s; } .puntitos i:nth-child(3) { animation-delay: .36s; }
@keyframes p { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }
</style>
</head>
<body>

<!-- ── acceso ── -->
<div class="acceso" id="acceso">
  <form class="acceso-caja" id="formAcceso">
    <div class="marca"><img src="/logo-nav.webp" alt="" /><span style="font-family:var(--font-display);font-size:19px;">Intellectum</span></div>
    <h1>Panel del negocio</h1>
    <p>Escribe tu clave de acceso. Es la misma del agente privado.</p>
    <input type="password" id="clave" placeholder="Clave de acceso" autocomplete="current-password" />
    <button type="submit">Entrar</button>
    <p class="acceso-error" id="accesoError">Esa clave no es. Revísala e intenta otra vez.</p>
  </form>
</div>

<!-- ── aplicación ── -->
<div class="app" id="app">
  <div class="topbar">
    <img src="/logo-nav.webp" alt="" />
    <span class="titulo">Panel</span>
    <span class="espacio"></span>
    <button class="salir" id="salir">Salir</button>
  </div>

  <nav class="tabs" aria-label="Secciones del panel">
    <button class="tab activa" data-vista="resumen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Resumen</button>
    <button class="tab" data-vista="leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Leads</button>
    <button class="tab" data-vista="chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Chats</button>
    <button class="tab" data-vista="citas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Citas</button>
    <button class="tab" data-vista="agente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M4.9 19.1l2.2-2.2M16.9 7.1l2.2-2.2"/></svg>
      IntelliA</button>
  </nav>

  <div class="lienzo">
    <section class="vista activa" id="vista-resumen"><div class="cargando">Cargando…</div></section>
    <section class="vista" id="vista-leads"></section>
    <section class="vista" id="vista-chats"></section>
    <section class="vista" id="vista-citas"></section>
    <section class="vista" id="vista-agente">
      <div class="chatp">
        <div class="chatp-log" id="agenteLog">
          <div class="burbuja aviso">Tu agente privado. Pregúntale por tus leads, tus citas o cómo va la semana.</div>
        </div>
        <div class="sugerencias" id="agenteSugerencias">
          <button>¿Cómo va la semana?</button>
          <button>¿Qué leads tengo pendientes?</button>
          <button>¿Qué citas vienen?</button>
        </div>
        <div class="chatp-fila">
          <textarea id="agenteEntrada" rows="1" placeholder="Pregúntale a tu agente…"></textarea>
          <button id="agenteEnviar" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:18px;height:18px"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CLAVE = localStorage.getItem("panel_clave") || "";
  var acceso = document.getElementById("acceso");
  var app = document.getElementById("app");

  /* ─────────────────────────────────────────────────────────────── acceso */

  document.getElementById("formAcceso").addEventListener("submit", function (e) {
    e.preventDefault();
    var valor = document.getElementById("clave").value.trim();
    if (!valor) return;
    probarClave(valor);
  });

  function probarClave(valor) {
    pedir("resumen", {}, valor)
      .then(function (datos) {
        CLAVE = valor;
        localStorage.setItem("panel_clave", valor);
        entrar(datos);
      })
      .catch(function () {
        document.getElementById("accesoError").style.display = "block";
      });
  }

  function entrar(resumenYaCargado) {
    acceso.style.display = "none";
    app.style.display = "block";
    if (resumenYaCargado) pintarResumen(resumenYaCargado);
    else cargar("resumen");
  }

  function salir() {
    localStorage.removeItem("panel_clave");
    location.reload();
  }
  document.getElementById("salir").addEventListener("click", salir);

  if (CLAVE) probarClave(CLAVE);

  /* ────────────────────────────────────────────────────────────────── api */

  function pedir(vista, params, claveManual) {
    var q = new URLSearchParams(Object.assign({ vista: vista }, params || {}));
    return fetch("/api/panel?" + q.toString(), {
      headers: { Authorization: "Bearer " + (claveManual || CLAVE) },
    }).then(function (r) {
      if (r.status === 401) { if (!claveManual) salir(); throw new Error("401"); }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function ordenar(accion, cuerpo) {
    return fetch("/api/panel", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + CLAVE },
      body: JSON.stringify(Object.assign({ accion: accion }, cuerpo)),
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* ─────────────────────────────────────────────────────────────── pestañas */

  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      tabs.forEach(function (x) { x.classList.remove("activa"); });
      t.classList.add("activa");
      document.querySelectorAll(".vista").forEach(function (v) { v.classList.remove("activa"); });
      var vista = t.dataset.vista;
      document.getElementById("vista-" + vista).classList.add("activa");
      if (vista !== "agente") cargar(vista);
    });
  });

  function cargar(vista) {
    if (vista === "resumen") pedir("resumen").then(pintarResumen).catch(fallo("resumen"));
    if (vista === "leads") cargarLeads("");
    if (vista === "chats") pedir("conversaciones").then(pintarChats).catch(fallo("chats"));
    if (vista === "citas") pedir("citas").then(pintarCitas).catch(fallo("citas"));
  }

  function fallo(vista) {
    return function () {
      document.getElementById("vista-" + vista).innerHTML =
        '<div class="vacio">No se pudo cargar. Revisa tu conexión e intenta de nuevo.</div>';
    };
  }

  /* ────────────────────────────────────────────────────────────── formato */

  function esc(t) {
    var d = document.createElement("span");
    d.textContent = t == null ? "" : String(t);
    return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function haceCuanto(iso) {
    if (!iso) return "";
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "ahora";
    if (min < 60) return "hace " + min + " min";
    var h = Math.round(min / 60);
    if (h < 24) return "hace " + h + " h";
    var dias = Math.round(h / 24);
    if (dias === 1) return "ayer";
    if (dias < 30) return "hace " + dias + " días";
    return new Date(iso).toLocaleDateString("es-EC", { day: "numeric", month: "short" });
  }

  function etiquetaCanal(c) {
    return c === "whatsapp" ? "WhatsApp" : c === "web" ? "Web" : c || "—";
  }

  /* ────────────────────────────────────────────────────────────── resumen */

  function irA(vista) {
    var boton = document.querySelector('.tab[data-vista="' + vista + '"]');
    if (boton) boton.click();
  }

  function pintarResumen(d) {
    var v = document.getElementById("vista-resumen");
    var s = d.citas && d.citas.siguiente;
    v.innerHTML =
      '<div class="stats">' +
      stat(d.leads.ultimos7, "leads esta semana", "leads") +
      stat(d.leads.ultimos30, "leads este mes", "leads") +
      stat(d.leads.nuevos, "por atender", "leads") +
      stat(d.citas.proximas, "citas próximas", "citas") +
      (d.leads.embudo && d.leads.embudo.abierto > 0
        ? stat("$" + Number(d.leads.embudo.abierto).toLocaleString("es-EC"), "en el embudo", "leads")
        : "") +
      (d.leads.embudo && d.leads.embudo.ganado > 0
        ? stat("$" + Number(d.leads.embudo.ganado).toLocaleString("es-EC"), "ganado", "leads")
        : "") +
      "</div>" +
      (d.leads.en_riesgo
        ? '<div class="alerta-riesgo" data-ir="leads">🧊 ' +
          (d.leads.en_riesgo === 1
            ? "1 lead de urgencia alta lleva 3+ días sin atención. Llámalo antes de que se enfríe."
            : d.leads.en_riesgo + " leads de urgencia alta llevan 3+ días sin atención. Llámalos antes de que se enfríen.") +
          "</div>"
        : "") +
      (s
        ? '<h2 class="seccion">Siguiente cita</h2><div class="tarjeta" data-ir="citas"><div class="fila1">' +
          '<span class="nombre">' + esc(s.nombre || "Sin nombre") + "</span>" +
          '<span class="cuando">' + esc(s.etiqueta) + "</span></div>" +
          (s.contacto ? '<div class="contacto">' + esc(s.contacto) + "</div>" : "") +
          "</div>"
        : "") +
      bloqueConsumo(d.consumo) +
      '<h2 class="seccion">Última actividad</h2>' +
      ((d.eventos || []).map(filaActividad).join("") ||
        '<div class="vacio">Sin actividad todavía.</div>') +
      (d.persistente ? "" : '<div class="vacio">⚠ Sin base de datos real: ' + esc(d.guardadoEn) + "</div>");

    v.querySelectorAll("[data-ir]").forEach(function (el) {
      el.addEventListener("click", function () { irA(el.dataset.ir); });
    });
  }

  /* CUÁNTOS MENSAJES CUESTA UNA CONVERSACIÓN.
     Desde el 1 de octubre de 2026 Meta cobra por mensaje entregado, no por
     conversación. Los topes de cada plan se calcularon sobre una estimación;
     este bloque la reemplaza por la cuenta real. Sin conversaciones todavía
     lo dice con todas sus letras, en vez de enseñar un cero que parece dato. */
  function bloqueConsumo(c) {
    if (!c) return "";
    var titulo = '<h2 class="seccion">Mensajes de WhatsApp (últimos 30 días)</h2>';

    if (!c.entregados || !c.entregados.total)
      return titulo + '<div class="vacio">Todavía no ha salido ningún mensaje. ' +
        'Cuando IntelliA empiece a atender por WhatsApp, aquí verás cuántos ' +
        'mensajes entrega en cada conversación.</div>';

    if (!c.conversaciones)
      return titulo + '<div class="vacio">' + esc(c.entregados.al_equipo) +
        ' aviso' + (c.entregados.al_equipo === 1 ? "" : "s") + ' interno' +
        (c.entregados.al_equipo === 1 ? "" : "s") + ', ninguna conversación con clientes.</div>';

    return titulo +
      '<div class="stats">' +
      stat(Number(c.por_conversacion).toLocaleString("es-EC"), "mensajes por conversación") +
      stat(c.conversaciones, "conversaciones") +
      stat(c.entregados.a_clientes, "mensajes a clientes") +
      stat(c.por_tipo.plantilla, "con plantilla") +
      "</div>" +
      (c.entregados.al_equipo
        ? '<div class="vacio">Aparte, ' + esc(c.entregados.al_equipo) +
          ' aviso' + (c.entregados.al_equipo === 1 ? "" : "s") +
          ' interno' + (c.entregados.al_equipo === 1 ? "" : "s") +
          ' al equipo (no cuentan como atención al cliente).</div>'
        : "") +
      (c.truncado
        ? '<div class="vacio">⚠ Hay más mensajes de los que se alcanzaron a leer: ' +
          'el promedio es de una muestra, no del total.</div>'
        : "");
  }

  function stat(n, label, ir) {
    return '<div class="stat"' + (ir ? ' data-ir="' + ir + '"' : "") + '><div class="num">' +
      esc(n) + '</div><div class="label">' + esc(label) + "</div></div>";
  }

  /* La bitácora guarda códigos de máquina; aquí se traducen a frases de humano. */
  function humanizarEvento(e) {
    var det = e.detalle || {};
    var h = det.herramienta || "";
    if (e.tipo === "mensaje_procesado")
      return { icono: "💬", texto: "IntelliA atendió un mensaje de WhatsApp", ir: "chats" };
    if (e.tipo === "consulta_disponibilidad")
      return { icono: "🕐", texto: "Alguien consultó horarios para una cita", ir: "citas" };
    if (e.tipo === "herramienta_ejecutada") {
      if (h === "guardar_lead") return { icono: "⭐", texto: "IntelliA capturó un lead nuevo", ir: "leads" };
      if (h === "agendar_cita") return { icono: "📅", texto: "Se agendó una cita nueva", ir: "citas" };
      if (h === "reagendar_cita") return { icono: "📅", texto: "Se movió una cita", ir: "citas" };
      if (h === "cancelar_cita") {
        if (det.origen === "panel")
          return {
            icono: "📅",
            texto: "Cancelaste una cita desde el panel" + (det.correo_enviado ? " y se pidió reagendar por correo" : ""),
            ir: "citas",
          };
        return { icono: "📅", texto: "Se canceló una cita", ir: "citas" };
      }
      if (h === "ver_disponibilidad") return { icono: "🕐", texto: "Alguien revisó horarios disponibles", ir: "citas" };
      if (h === "escalar_a_humano") return { icono: "🙋", texto: "Una conversación pidió atención humana", ir: "chats" };
      return { icono: "⚙️", texto: "IntelliA usó " + (h || "una herramienta"), ir: null };
    }
    if (e.tipo === "herramienta_fallida")
      return { icono: "⚠️", texto: "Falló una acción de IntelliA" + (h ? " (" + h + ")" : ""), ir: null };
    if (e.tipo === "herramienta_rechazada")
      return { icono: "🛑", texto: "IntelliA intentó algo fuera de su alcance y se bloqueó", ir: null };
    if (e.tipo === "accion_pendiente_de_confirmacion")
      return { icono: "✋", texto: "Hay una acción esperando tu visto bueno", ir: null };
    return { icono: "·", texto: e.tipo.replace(/_/g, " "), ir: null };
  }

  function filaActividad(e) {
    var x = humanizarEvento(e);
    if (!x) return ""; // contadores y ruido de máquina: no son actividad
    return (
      '<div class="act-fila"' + (x.ir ? ' data-ir="' + x.ir + '"' : "") + ">" +
      '<span class="act-icono">' + x.icono + "</span>" +
      '<span class="act-texto">' + esc(x.texto) + "</span>" +
      '<span class="act-cuando">' + haceCuanto(e.creado_en) + "</span>" +
      "</div>"
    );
  }

  /* ──────────────────────────────────────────────────────────────── leads */

  var ESTADOS = ["nuevo", "contactado", "en_conversacion", "ganado", "perdido"];
  var NOMBRE_ESTADO = { en_conversacion: "en conversación" };
  var FILTROS = [
    ["todos", "Todos"], ["riesgo", "🧊 En riesgo"], ["nuevo", "Nuevos"],
    ["contactado", "Contactados"], ["en_conversacion", "En conversación"],
    ["ganado", "Ganados"], ["perdido", "Perdidos"],
  ];
  var filtroLeads = "todos";

  function montarFiltros(v) {
    var zona = document.createElement("div");
    zona.className = "filtros";
    FILTROS.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "chip-filtro" + (filtroLeads === f[0] ? " activo" : "");
      b.textContent = f[1];
      b.addEventListener("click", function () {
        filtroLeads = f[0];
        zona.querySelectorAll(".chip-filtro").forEach(function (x) { x.classList.remove("activo"); });
        b.classList.add("activo");
        pintaListaLeads(document.getElementById("buscaLeads").value.trim());
      });
      zona.appendChild(b);
    });
    v.insertBefore(zona, document.getElementById("listaLeads"));
  }

  function cargarLeads(texto) {
    var v = document.getElementById("vista-leads");
    v.innerHTML =
      '<input class="buscador" id="buscaLeads" placeholder="Buscar por nombre, empresa o necesidad…" value="' + esc(texto) + '" />' +
      '<div id="listaLeads"><div class="cargando">Cargando…</div></div>';

    montarFiltros(v);

    var caja = document.getElementById("buscaLeads");
    var pausa;
    caja.addEventListener("input", function () {
      clearTimeout(pausa);
      pausa = setTimeout(function () { pintaListaLeads(caja.value.trim()); }, 350);
    });

    pintaListaLeads(texto);
  }

  function pintaListaLeads(texto) {
    pedir("leads", texto ? { texto: texto } : {})
      .then(function (d) {
        // Los que se están enfriando van arriba; el resto conserva su orden.
        d.leads = d.leads.slice().sort(function (a, b) { return leadEnRiesgo(b) - leadEnRiesgo(a); });
        if (filtroLeads === "riesgo") d.leads = d.leads.filter(leadEnRiesgo);
        else if (filtroLeads !== "todos") d.leads = d.leads.filter(function (l) { return (l.estado || "nuevo") === filtroLeads; });
        var zona = document.getElementById("listaLeads");
        if (!d.leads.length) {
          zona.innerHTML = '<div class="vacio">' + (filtroLeads !== "todos" ? "Ninguno con este filtro." : texto ? "Nada con ese texto." : "Todavía no hay leads.") + "</div>";
          return;
        }
        zona.innerHTML = d.leads.map(tarjetaLead).join("");
        zona.querySelectorAll("[data-estado]").forEach(function (b) {
          b.addEventListener("click", function () { cambiarEstado(b); });
        });
        zona.querySelectorAll("[data-guardar-nota]").forEach(function (b) {
          b.addEventListener("click", function () { guardarNota(b); });
        });
        zona.querySelectorAll("[data-quitar-etiqueta]").forEach(function (b) {
          b.addEventListener("click", function () { quitarEtiqueta(b); });
        });
        zona.querySelectorAll("[data-nueva-etiqueta]").forEach(function (i) {
          i.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); agregarEtiqueta(i); }
          });
        });
        zona.querySelectorAll("[data-valor]").forEach(function (i) {
          i.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); i.blur(); }
          });
          i.addEventListener("blur", function () { guardarValor(i); });
        });
      })
      .catch(fallo("leads"));
  }

  /* Urgencia alta y nadie lo ha tocado en 3+ días: se está enfriando.
     La misma regla vive en api/panel.js (en_riesgo); si cambia allá, cambia aquí. */
  function leadEnRiesgo(l) {
    return (l.estado || "nuevo") === "nuevo" &&
      String(l.urgencia || "").toLowerCase() === "alta" &&
      Date.now() - new Date(l.creado_en).getTime() > 3 * 86400000 ? 1 : 0;
  }

  function diasSinTocar(l) {
    return Math.floor((Date.now() - new Date(l.creado_en).getTime()) / 86400000);
  }

  function tarjetaLead(l) {
    var estado = l.estado || "nuevo";
    return (
      '<div class="tarjeta" data-lead="' + esc(l.id) + '">' +
      '<div class="fila1"><span class="nombre">' + esc(l.nombre || "Sin nombre") + "</span>" +
      (l.empresa ? '<span style="color:var(--text-muted);font-size:13px;">· ' + esc(l.empresa) + "</span>" : "") +
      '<span class="cuando">' + haceCuanto(l.creado_en) + "</span></div>" +
      '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">' +
      '<span class="pastilla canal">' + esc(etiquetaCanal(l.canal)) + "</span>" +
      (l.urgencia ? '<span class="pastilla ' + esc(l.urgencia) + '">' + esc(l.urgencia) + "</span>" : "") +
      (leadEnRiesgo(l) ? '<span class="pastilla riesgo">🧊 ' + diasSinTocar(l) + " días sin atención</span>" : "") +
      "</div>" +
      (l.necesidad || l.resumen ? '<div class="detalle">' + esc(l.necesidad || l.resumen) + "</div>" : "") +
      '<div class="etiquetas-zona">' +
      (Array.isArray(l.etiquetas) ? l.etiquetas : []).map(function (e) {
        return '<span class="pastilla etiqueta" data-etiqueta="' + esc(e) + '">' + esc(e) +
          '<button class="quitar" data-quitar-etiqueta title="Quitar etiqueta">×</button></span>';
      }).join("") +
      '<input class="etiqueta-nueva" data-nueva-etiqueta placeholder="+ etiqueta" maxlength="30" />' +
      "</div>" +
      '<div class="valor-zona"><span class="moneda">$</span>' +
      '<input class="valor-input" data-valor inputmode="decimal" placeholder="valor estimado"' +
      ' value="' + (l.valor_estimado == null ? "" : esc(l.valor_estimado)) + '"' +
      ' data-previo="' + (l.valor_estimado == null ? "" : esc(l.valor_estimado)) + '" />' +
      (estado === "perdido" && l.motivo_perdida
        ? '<span class="motivo-txt">Perdido: ' + esc(l.motivo_perdida) + "</span>"
        : "") +
      "</div>" +
      (l.contacto ? '<div class="contacto">' + enlaceContacto(l.contacto) + "</div>" : "") +
      '<div class="estados">' +
      ESTADOS.map(function (e) {
        return '<button class="estado-btn ' + e + (e === estado ? " activo" : "") + '" data-estado="' + e + '">' + (NOMBRE_ESTADO[e] || e) + "</button>";
      }).join("") +
      "</div>" +
      '<div class="nota-zona"><textarea placeholder="Nota interna…">' + esc(l.nota || "") + "</textarea>" +
      '<button data-guardar-nota>Guardar</button></div>' +
      "</div>"
    );
  }

  function enlaceContacto(c) {
    if (c.includes("@")) return '<a href="mailto:' + esc(c) + '">' + esc(c) + "</a>";
    var digitos = c.replace(/[^\d+]/g, "");
    if (digitos.length >= 8) return '<a href="tel:' + esc(digitos) + '">' + esc(c) + "</a>";
    return esc(c);
  }

  function cambiarEstado(boton) {
    var tarjeta = boton.closest("[data-lead]");
    ordenar("lead", { id: tarjeta.dataset.lead, estado: boton.dataset.estado })
      .then(function () {
        tarjeta.querySelectorAll("[data-estado]").forEach(function (b) { b.classList.remove("activo"); });
        boton.classList.add("activo");
        if (boton.dataset.estado === "perdido") pedirMotivo(tarjeta);
      })
      .catch(function () { alert("No se pudo guardar el estado."); });
  }

  /* El motivo de pérdida se pregunta justo al marcar perdido, que es cuando el
     dueño lo tiene fresco. Es opcional: cerrar la zona no guarda nada. */
  function pedirMotivo(tarjeta) {
    if (tarjeta.querySelector(".motivo-zona")) return;
    var zona = document.createElement("div");
    zona.className = "motivo-zona";
    var texto = document.createElement("div");
    texto.textContent = "¿Por qué se perdió? Es opcional, pero leerlos juntos enseña.";
    var opciones = document.createElement("div");
    opciones.className = "opciones";
    zona.appendChild(texto);
    zona.appendChild(opciones);
    tarjeta.appendChild(zona);

    function guardar(motivo) {
      ordenar("lead", { id: tarjeta.dataset.lead, motivo_perdida: motivo })
        .then(function () {
          pintaListaLeads(document.getElementById("buscaLeads").value.trim());
        })
        .catch(avisoLead);
    }

    ["Precio", "No respondió", "Eligió otra opción", "No era el momento"].forEach(function (m) {
      var b = document.createElement("button");
      b.className = "motivo-op";
      b.textContent = m;
      b.addEventListener("click", function () { guardar(m); });
      opciones.appendChild(b);
    });
    var otro = document.createElement("input");
    otro.className = "motivo-otro";
    otro.placeholder = "otro motivo…";
    otro.maxLength = 300;
    otro.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && otro.value.trim()) { e.preventDefault(); guardar(otro.value.trim()); }
    });
    opciones.appendChild(otro);
    var cerrar = document.createElement("button");
    cerrar.className = "motivo-op";
    cerrar.textContent = "Omitir";
    cerrar.addEventListener("click", function () { zona.remove(); });
    opciones.appendChild(cerrar);
  }

  function etiquetasDe(tarjeta) {
    return Array.prototype.map.call(tarjeta.querySelectorAll("[data-etiqueta]"), function (p) {
      return p.dataset.etiqueta;
    });
  }

  function agregarEtiqueta(input) {
    var tarjeta = input.closest("[data-lead]");
    var nueva = input.value.trim().toLowerCase();
    if (!nueva) return;
    var lista = etiquetasDe(tarjeta);
    if (lista.indexOf(nueva) === -1) lista.push(nueva);
    input.disabled = true;
    ordenar("lead", { id: tarjeta.dataset.lead, etiquetas: lista })
      .then(function () {
        pintaListaLeads(document.getElementById("buscaLeads").value.trim());
      })
      .catch(function (e) { input.disabled = false; avisoLead(e); });
  }

  function quitarEtiqueta(boton) {
    var tarjeta = boton.closest("[data-lead]");
    var chip = boton.closest("[data-etiqueta]");
    var lista = etiquetasDe(tarjeta).filter(function (e) { return e !== chip.dataset.etiqueta; });
    ordenar("lead", { id: tarjeta.dataset.lead, etiquetas: lista })
      .then(function () { chip.remove(); })
      .catch(avisoLead);
  }

  function guardarValor(input) {
    var crudo = input.value.trim().replace(",", ".");
    if (crudo === (input.dataset.previo || "")) return;
    var valor = crudo === "" ? null : Number(crudo);
    if (valor !== null && (!isFinite(valor) || valor < 0)) {
      input.value = input.dataset.previo || "";
      return;
    }
    var tarjeta = input.closest("[data-lead]");
    ordenar("lead", { id: tarjeta.dataset.lead, valor_estimado: valor })
      .then(function () { input.dataset.previo = crudo; })
      .catch(function (e) { input.value = input.dataset.previo || ""; avisoLead(e); });
  }

  function avisoLead() {
    alert("No se pudo guardar. Si es la primera vez que usas etiquetas o valores, falta aplicar supabase/crm.sql en la base (Supabase → SQL Editor).");
  }

  function guardarNota(boton) {
    var tarjeta = boton.closest("[data-lead]");
    var texto = tarjeta.querySelector("textarea").value;
    boton.textContent = "…";
    ordenar("lead", { id: tarjeta.dataset.lead, nota: texto })
      .then(function () { boton.textContent = "Guardado ✓"; setTimeout(function () { boton.textContent = "Guardar"; }, 1600); })
      .catch(function () { boton.textContent = "Guardar"; alert("No se pudo guardar la nota."); });
  }

  /* ──────────────────────────────────────────────────────────────── chats */

  function pintarChats(d) {
    var v = document.getElementById("vista-chats");
    if (!d.conversaciones.length) {
      v.innerHTML = '<div class="vacio">No hay conversaciones activas.</div>';
      return;
    }
    v.innerHTML = d.conversaciones.map(function (c) {
      return (
        '<button class="fila-chat" data-canal="' + esc(c.canal) + '" data-sesion="' + esc(c.sesion) + '">' +
        "<div><div class=\"quien\">" + esc(etiquetaCanal(c.canal)) + " · " + esc(acortarSesion(c.sesion)) + "</div>" +
        '<div class="resumen">' + esc(c.ultimo) + "</div></div>" +
        '<div class="lado">' + haceCuanto(c.actualizado_en) + "<br>" + esc(c.mensajes) + " msjs</div>" +
        "</button>"
      );
    }).join("");
    v.querySelectorAll(".fila-chat").forEach(function (f) {
      f.addEventListener("click", function () { abrirChat(f.dataset.canal, f.dataset.sesion); });
    });
  }

  function acortarSesion(s) {
    s = String(s || "");
    if (/^\d{10,15}$/.test(s)) return "+" + s; // un teléfono se muestra completo
    return s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-4) : s;
  }

  function abrirChat(canal, sesion) {
    var v = document.getElementById("vista-chats");
    v.innerHTML = '<div class="cargando">Cargando…</div>';
    pedir("conversacion", { canal: canal, sesion: sesion })
      .then(function (d) {
        v.innerHTML =
          '<button class="volver" id="volverChats">← Todas las conversaciones</button>' +
          '<div style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">' +
          esc(etiquetaCanal(canal)) + " · " + esc(acortarSesion(sesion)) + "</div>" +
          '<div class="burbujas">' +
          ((d.mensajes || []).map(function (m) {
            var quien = m.role === "user" ? "cliente" : (m.via === "panel" ? "bot mano" : "bot");
            var texto = typeof m.content === "string" ? m.content : "[contenido multimedia]";
            return '<div class="burbuja ' + quien + '">' + esc(texto) + "</div>";
          }).join("") || '<div class="vacio">Conversación vacía o vencida.</div>') +
          "</div>";
        document.getElementById("volverChats").addEventListener("click", function () {
          pedir("conversaciones").then(pintarChats).catch(fallo("chats"));
        });
        if (canal === "whatsapp") montarComposer(v, canal, sesion);
      })
      .catch(fallo("chats"));
  }

  /* El cajón para responder a mano. Solo WhatsApp: en el chat de la web no hay
     forma de empujarle un mensaje al visitante después de que cerró la página. */
  function montarComposer(v, canal, sesion) {
    var caja = document.createElement("div");
    caja.className = "composer";
    var campo = document.createElement("textarea");
    campo.placeholder = "Responder por WhatsApp…";
    campo.rows = 1;
    var boton = document.createElement("button");
    boton.type = "button";
    boton.className = "enviar-mano";
    boton.textContent = "Enviar";
    caja.appendChild(campo);
    caja.appendChild(boton);
    var nota = document.createElement("div");
    nota.className = "composer-nota";
    nota.textContent = "Llega al instante si el cliente escribió en las últimas 24 horas.";
    v.appendChild(caja);
    v.appendChild(nota);

    function avisar(texto, alerta) {
      nota.textContent = texto;
      nota.classList.toggle("alerta", Boolean(alerta));
    }

    function enviar() {
      var texto = campo.value.trim();
      if (!texto || boton.disabled) return;
      boton.disabled = true;
      boton.textContent = "Enviando…";
      ordenar("responder", { canal: canal, sesion: sesion, texto: texto })
        .then(function (r) {
          if (r.ok) { abrirChat(canal, sesion); return; }
          boton.disabled = false;
          boton.textContent = "Enviar";
          if (r.motivo === "ventana") {
            avisar("No se entregó: la ventana de 24 horas ya cerró. El cliente tiene que escribirte primero.", true);
          } else {
            avisar("No se pudo enviar. Intenta de nuevo.", true);
          }
        })
        .catch(function () {
          boton.disabled = false;
          boton.textContent = "Enviar";
          avisar("Se cortó la conexión. Intenta de nuevo.", true);
        });
    }

    boton.addEventListener("click", enviar);
    campo.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
    });
    campo.addEventListener("input", function () {
      campo.style.height = "auto";
      campo.style.height = Math.min(campo.scrollHeight, 140) + "px";
    });
    campo.focus();
  }

  /* ──────────────────────────────────────────────────────────────── citas */

  function pintarCitas(d) {
    var v = document.getElementById("vista-citas");
    if (d.agenda === false) {
      v.innerHTML = '<div class="vacio">La agenda no está conectada.</div>';
      return;
    }
    if (!d.citas.length) {
      v.innerHTML = '<div class="vacio">No hay citas en los próximos 14 días.</div>';
      return;
    }
    v.innerHTML = d.citas.map(function (c) {
      return (
        '<div class="tarjeta" data-cita="' + esc(c.codigo) + '" data-contacto="' + esc(c.contacto || "") + '">' +
        '<div class="fila1">' +
        '<span class="nombre">' + esc(c.nombre || c.titulo || "Sin nombre") + "</span>" +
        '<span class="cuando">' + esc(c.etiqueta) + "</span></div>" +
        (c.contacto ? '<div class="contacto">' + enlaceContacto(c.contacto) + "</div>" : "") +
        (c.codigo
          ? '<div class="cita-pie"><span class="codigo">código ' + esc(c.codigo) + "</span>" +
            '<button class="btn-mover" data-mover>Mover</button>' +
            '<button class="btn-cancelar" data-cancelar>Cancelar cita</button></div>'
          : "") +
        "</div>"
      );
    }).join("");
    v.querySelectorAll("[data-cancelar]").forEach(function (b) {
      b.addEventListener("click", function () { confirmarCancelacion(b); });
    });
    v.querySelectorAll("[data-mover]").forEach(function (b) {
      b.addEventListener("click", function () { elegirNuevaHora(b); });
    });
  }

  /* Mover una cita: se cargan las horas libres y, al elegir una, la cita se
     mueve y al cliente le llega la invitación nueva. Igual que al cancelar,
     el resultado dice con claridad qué aviso salió y cuál no. */
  function elegirNuevaHora(boton) {
    var tarjeta = boton.closest("[data-cita]");
    if (tarjeta.querySelector(".horas-zona") || tarjeta.querySelector(".confirma-zona")) return;

    var zona = document.createElement("div");
    zona.className = "horas-zona";
    var texto = document.createElement("div");
    texto.textContent = "Cargando las horas libres…";
    var opciones = document.createElement("div");
    opciones.className = "opciones";
    zona.appendChild(texto);
    zona.appendChild(opciones);
    tarjeta.appendChild(zona);

    var cerrar = document.createElement("button");
    cerrar.className = "hora-op quieta";
    cerrar.textContent = "Dejarla como está";
    cerrar.addEventListener("click", function () { zona.remove(); });

    pedir("horarios")
      .then(function (d) {
        var horas = d.horarios || [];
        if (!horas.length) {
          texto.textContent = "No hay horas libres en los próximos días.";
          opciones.appendChild(cerrar);
          return;
        }
        texto.textContent = "Elige la nueva hora. Al elegirla, la cita se mueve y al cliente le llega la invitación nueva por correo y el aviso por WhatsApp.";
        horas.forEach(function (h) {
          var b = document.createElement("button");
          b.className = "hora-op";
          b.textContent = h.etiqueta;
          b.addEventListener("click", function () { moverA(h, b); });
          opciones.appendChild(b);
        });
        opciones.appendChild(cerrar);
      })
      .catch(function () {
        texto.textContent = "No se pudieron cargar las horas. Cierra y vuelve a intentar.";
        opciones.appendChild(cerrar);
      });

    function moverA(h, b) {
      zona.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
      b.textContent = "Moviendo…";
      ordenar("mover_cita", { codigo: tarjeta.dataset.cita, nueva_hora: h.codigo })
        .then(function (r) {
          if (!r.ok) {
            b.remove();
            zona.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
            texto.textContent = r.motivo === "ocupado"
              ? "Esa hora se acaba de ocupar. Elige otra."
              : "No se pudo mover. Intenta de nuevo.";
            return;
          }
          zona.remove();
          var cuando = tarjeta.querySelector(".cuando");
          if (cuando) cuando.textContent = r.a;
          var resultado = document.createElement("div");
          resultado.className = "cita-resultado";
          resultado.textContent =
            r.correo && r.whatsapp
              ? "✓ Movida al " + r.a + ". Avisado por correo y WhatsApp."
              : r.correo
                ? "✓ Movida al " + r.a + ". Le llegó el correo con la invitación nueva (el WhatsApp no salió)."
                : r.whatsapp
                  ? "✓ Movida al " + r.a + ". Avisado por WhatsApp (sin correo)."
                  : "✓ Movida al " + r.a + ". ⚠ No salió ningún aviso: escríbele tú.";
          tarjeta.appendChild(resultado);
        })
        .catch(function () {
          b.textContent = h.etiqueta;
          zona.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
          texto.textContent = "Se cortó la conexión. Intenta de nuevo.";
        });
    }
  }

  /* Cancelar desde el panel es para emergencias: por eso pide confirmación
     explícita y deja claro, antes y después, si al cliente le llegó el aviso. */
  function confirmarCancelacion(boton) {
    var tarjeta = boton.closest("[data-cita]");
    if (tarjeta.querySelector(".confirma-zona")) return;
    var contacto = tarjeta.dataset.contacto || "";
    var esCorreo = contacto.indexOf("@") !== -1;

    var zona = document.createElement("div");
    zona.className = "confirma-zona";
    var texto = document.createElement("div");
    texto.textContent = esCorreo
      ? "Se cancelará la cita y se le avisará a " + contacto + " por correo (y por WhatsApp si dejó número) con la disculpa y el pedido de reagendar. ¿Seguro?"
      : "Se cancelará la cita y se intentará avisar por WhatsApp a " + (contacto || "su número") + " con la disculpa y el pedido de reagendar. ¿Seguro?";
    var botones = document.createElement("div");
    botones.className = "botones";
    var si = document.createElement("button");
    si.className = "si"; si.textContent = "Sí, cancelar";
    var no = document.createElement("button");
    no.className = "no"; no.textContent = "No, dejarla";
    botones.appendChild(si); botones.appendChild(no);
    zona.appendChild(texto); zona.appendChild(botones);
    tarjeta.appendChild(zona);

    no.addEventListener("click", function () { zona.remove(); });
    si.addEventListener("click", function () {
      si.disabled = true; no.disabled = true;
      si.textContent = "Cancelando…";
      ordenar("cancelar_cita", { codigo: tarjeta.dataset.cita })
        .then(function (r) {
          zona.remove();
          boton.remove();
          var resultado = document.createElement("div");
          resultado.className = "cita-resultado";
          var quien = r.contacto || contacto || "cliente";
          resultado.textContent =
            r.correo && r.whatsapp
              ? "✓ Cancelada. Avisado por correo y WhatsApp con el pedido de reagendar."
              : r.correo
                ? "✓ Cancelada. Le llegó el correo pidiendo reagendar (el WhatsApp no salió)."
                : r.whatsapp
                  ? "✓ Cancelada. Avisado por WhatsApp con las fechas disponibles (sin correo)."
                  : "✓ Cancelada. ⚠ No salió ningún aviso: escríbele tú al " + quien + ".";
          tarjeta.appendChild(resultado);
          tarjeta.style.opacity = "0.65";
        })
        .catch(function () {
          si.disabled = false; no.disabled = false;
          si.textContent = "Sí, cancelar";
          alert("No se pudo cancelar. Intenta de nuevo.");
        });
    });
  }

  /* ─────────────────────────────────────────────────────── agente privado */

  var agenteHistorial = [];
  var agenteOcupado = false;
  var agenteLog = document.getElementById("agenteLog");
  var agenteEntrada = document.getElementById("agenteEntrada");
  var agenteEnviar = document.getElementById("agenteEnviar");

  document.getElementById("agenteSugerencias").addEventListener("click", function (e) {
    if (e.target.tagName === "BUTTON") mandarAlAgente(e.target.textContent);
  });
  agenteEnviar.addEventListener("click", function () { mandarAlAgente(agenteEntrada.value); });
  agenteEntrada.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandarAlAgente(agenteEntrada.value); }
  });

  function limpiarMd(t) {
    return String(t).replace(/\*\*(.+?)\*\*/g, "$1").replace(/__(.+?)__/g, "$1").replace(/^#{1,6}\s+/gm, "");
  }

  function burbujaAgente(clase, texto) {
    var b = document.createElement("div");
    b.className = "burbuja " + clase;
    b.textContent = texto;
    agenteLog.appendChild(b);
    agenteLog.scrollTop = agenteLog.scrollHeight;
    return b;
  }

  function mandarAlAgente(texto) {
    texto = (texto || "").trim();
    if (!texto || agenteOcupado) return;
    agenteEntrada.value = "";
    burbujaAgente("yo", texto);
    agenteHistorial.push({ role: "user", content: texto });
    if (agenteHistorial.length > 40) agenteHistorial = agenteHistorial.slice(-40);

    agenteOcupado = true;
    agenteEnviar.disabled = true;
    var b = document.createElement("div");
    b.className = "burbuja agente";
    b.innerHTML = '<span class="puntitos"><i></i><i></i><i></i></span>';
    agenteLog.appendChild(b);
    agenteLog.scrollTop = agenteLog.scrollHeight;

    var acumulado = "";
    var primero = true;

    fetch("/api/privado", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + CLAVE },
      body: JSON.stringify({ messages: agenteHistorial }),
    })
      .then(function (res) {
        if (!res.ok || !res.body) throw new Error("No se pudo hablar con el agente.");
        var lector = res.body.getReader();
        var dec = new TextDecoder();
        var buffer = "";
        function leer() {
          return lector.read().then(function (x) {
            if (x.done) return;
            buffer += dec.decode(x.value, { stream: true });
            var partes = buffer.split("\n\n");
            buffer = partes.pop();
            partes.forEach(function (p) {
              p = p.trim();
              if (p.indexOf("data:") !== 0) return;
              var ev;
              try { ev = JSON.parse(p.slice(5).trim()); } catch (e) { return; }
              if (ev.t === "delta" || ev.t === "error") {
                if (primero) { b.textContent = ""; primero = false; }
                acumulado += ev.v;
                b.textContent = limpiarMd(acumulado);
                agenteLog.scrollTop = agenteLog.scrollHeight;
              } else if (ev.t === "aviso") {
                burbujaAgente("aviso", ev.v);
              }
            });
            return leer();
          });
        }
        return leer();
      })
      .then(function () {
        if (acumulado) agenteHistorial.push({ role: "assistant", content: acumulado });
        else { b.remove(); burbujaAgente("aviso", "No llegó respuesta. Intenta otra vez."); }
      })
      .catch(function (err) {
        b.remove();
        burbujaAgente("aviso", err.message || "Se cortó la conexión.");
      })
      .then(function () {
        agenteOcupado = false;
        agenteEnviar.disabled = false;
      });
  }
})();
</script>
