<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
  <!-- Verificación de dominio de Meta. Demuestra que intellectum.ec es nuestro,
       y sin ella Meta no atribuye las conversiones de quien entra desde un
       iPhone. No se borra aunque parezca inerte: si desaparece, la
       verificación se cae y con ella la medición de la pauta. -->
  <meta name="facebook-domain-verification" content="9xfwj09xamrs3694cjhthfj1xqqax5" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Título y descripción NEUTROS a propósito. Este archivo viaja idéntico a
     todas las copias, así que no puede afirmar de quién es: el nombre real lo
     pone el JS con lo que responde /api/negocio. Antes decía "Intellectum AI
     Solutions" en la pestaña de cualquier negocio que publicara una copia. -->
<title>Agenda tu cita</title>
<meta name="description" content="Elige la hora que mejor te quede." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Geist:wght@300..600&display=swap" rel="stylesheet" />
<style>
/* El atributo hidden vale menos que cualquier regla de display, y esta página
   lo usa para esconder lo que la copia no tiene configurado (el logo, el botón
   de WhatsApp, las preguntas sugeridas). Sin esto, el hueco se sigue viendo. */
[hidden] { display: none !important; }

/* La misma paleta del sitio. Si cambia allá, cambia aquí. */
:root {
  --bg: #08090b;
  --bg-elev: #0d0f12;
  --card: rgba(255, 255, 255, 0.025);
  --card-hover: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.08);
  --border-fuerte: rgba(255, 255, 255, 0.16);
  --texto: #f7f8f8;
  --texto-dim: #a6adb0;
  --texto-tenue: #737d81;
  --cian: #22d3ee;
  --cian-claro: #67e8f9;
  --cian-hondo: #0891b2;
  --cian-tinte: rgba(34, 211, 238, 0.08);
  --cian-borde: rgba(34, 211, 238, 0.28);
  --rojo: #f87171;
  --display: "Fraunces", "Times New Roman", serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  /* Las curvas nativas de CSS son demasiado tibias para que una interfaz
     se sienta viva. Estas son las mismas que usa el resto del sitio. */
  --salida: cubic-bezier(0.23, 1, 0.32, 1);
  --entre: cubic-bezier(0.77, 0, 0.175, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--texto);
  font-family: var(--sans);
  font-weight: 300;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(20px, 5vw, 56px) clamp(16px, 4vw, 32px) 48px;
}

/* Un resplandor detrás de la tarjeta: la marca sin robarle atención al contenido. */
body::before {
  content: "";
  position: fixed;
  inset: -20% 0 auto 50%;
  width: min(900px, 130vw);
  height: 620px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 0%, rgba(34, 211, 238, 0.13), transparent 68%);
  pointer-events: none;
  z-index: 0;
}

.envoltorio { position: relative; z-index: 1; width: 100%; max-width: 620px; }

/* ── Encabezado ───────────────────────────────────────────────────────────── */
.marca {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: clamp(28px, 6vw, 44px);
  text-decoration: none; /* es un enlace, pero el rótulo no debe verse subrayado */
}
.marca img { height: 34px; width: auto; }
.marca span {
  font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--texto-tenue); font-weight: 500;
}
/* El nombre del negocio cuando esa copia no tiene logotipo propio: hace de
   logotipo, así que se lee como tal y no como el rótulo tenue de al lado. */
.marca .nombre-negocio {
  font-family: var(--display); font-size: 18px; letter-spacing: normal;
  text-transform: none; color: var(--texto); font-weight: 500;
}

h1 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(30px, 6.5vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 12px;
}
.bajada { color: var(--texto-dim); font-size: clamp(15px, 3.4vw, 16.5px); max-width: 46ch; }
.bajada strong { color: var(--texto); font-weight: 500; }

/* ── Horarios ─────────────────────────────────────────────────────────────── */
.dia { margin-top: 30px; }
.dia-titulo {
  font-size: 11.5px; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--texto-tenue); font-weight: 500; margin-bottom: 11px;
}
.horas { display: flex; flex-wrap: wrap; gap: 9px; }

.hora {
  appearance: none;
  font: inherit;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--texto);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 18px;
  cursor: pointer;
  /* Propiedades exactas, nunca "all": lo demás son fotogramas tirados. */
  transition:
    background-color 160ms var(--salida),
    border-color 160ms var(--salida),
    color 160ms var(--salida),
    transform 130ms var(--salida);
  /* Entran escalonadas: --i lo pone el JS. Nunca desde scale(0): nada en el
     mundo real aparece de la nada. */
  opacity: 0;
  animation: asomar 320ms var(--salida) forwards;
  animation-delay: calc(var(--i, 0) * 42ms);
}

@keyframes asomar {
  from { opacity: 0; transform: translateY(7px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* El hover solo donde hay ratón de verdad: en pantallas táctiles se dispara
   al tocar y deja el botón "pegado" en estado hover. */
@media (hover: hover) and (pointer: fine) {
  .hora:hover { background: var(--card-hover); border-color: var(--border-fuerte); }
}
.hora:active { transform: scale(0.97); }
.hora:focus-visible { outline: 2px solid var(--cian); outline-offset: 2px; }

.hora[aria-pressed="true"] {
  background: var(--cian-tinte);
  border-color: var(--cian-borde);
  color: var(--cian-claro);
}

/* ── Formulario ───────────────────────────────────────────────────────────── */
.tarjeta {
  margin-top: 30px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: clamp(20px, 4.5vw, 28px);
}
.elegida {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
}
.elegida-hora { font-family: var(--display); font-size: 20px; color: var(--cian-claro); }
.elegida-nota { font-size: 13.5px; color: var(--texto-tenue); }
.cambiar {
  appearance: none; background: none; border: none; font: inherit; font-size: 13.5px;
  color: var(--texto-dim); text-decoration: underline; text-underline-offset: 3px;
  cursor: pointer; padding: 0; margin-left: auto;
  transition: color 140ms var(--salida);
}
.cambiar:hover { color: var(--texto); }

.campo { margin-bottom: 15px; }
label { display: block; font-size: 12.5px; color: var(--texto-dim); margin-bottom: 6px; }
input, textarea {
  width: 100%; font: inherit; font-size: 15.5px; color: var(--texto);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 13px;
  transition: border-color 150ms var(--salida), background-color 150ms var(--salida);
}
textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--texto-tenue); }
input:focus, textarea:focus {
  outline: none; border-color: var(--cian-borde); background: rgba(255, 255, 255, 0.05);
}

.enviar {
  appearance: none; font: inherit; font-size: 15.5px; font-weight: 500;
  width: 100%; margin-top: 6px; padding: 14px 20px;
  color: #04191d; background: var(--cian); border: none; border-radius: 11px;
  cursor: pointer;
  transition: background-color 160ms var(--salida), transform 130ms var(--salida), opacity 160ms var(--salida);
}
@media (hover: hover) and (pointer: fine) { .enviar:hover { background: var(--cian-claro); } }
.enviar:active { transform: scale(0.985); }
.enviar:disabled { opacity: 0.55; cursor: default; transform: none; }
.enviar:focus-visible { outline: 2px solid var(--cian-claro); outline-offset: 3px; }

/* ── Estados ──────────────────────────────────────────────────────────────── */
.aviso {
  margin-top: 18px; padding: 13px 15px; border-radius: 11px; font-size: 14.5px;
  background: rgba(248, 113, 113, 0.09); border: 1px solid rgba(248, 113, 113, 0.28);
  color: #fca5a5;
}
.cargando, .vacio { margin-top: 30px; color: var(--texto-tenue); font-size: 15px; }

.listo { text-align: center; padding: clamp(28px, 6vw, 44px) 0; }
.listo-marca {
  width: 54px; height: 54px; margin: 0 auto 22px;
  border-radius: 50%; border: 1.5px solid var(--cian-borde); background: var(--cian-tinte);
  display: grid; place-items: center;
  /* Desde 0.9, no desde 0, y con la curva de entrada. */
  animation: sellar 420ms var(--salida) both;
}
@keyframes sellar {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.listo-marca svg { width: 24px; height: 24px; stroke: var(--cian-claro); }
.listo h2 { font-family: var(--display); font-weight: 500; font-size: clamp(24px, 5.5vw, 30px); margin-bottom: 10px; }
.listo p { color: var(--texto-dim); max-width: 40ch; margin: 0 auto 8px; }
.listo .cuando { color: var(--cian-claro); font-size: 18px; font-family: var(--display); }

.pie {
  margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--border);
  font-size: 13px; color: var(--texto-tenue); display: flex; flex-wrap: wrap; gap: 6px 18px;
}
.pie a { color: var(--texto-dim); text-decoration: none; }
.pie a:hover { color: var(--cian-claro); }

.oculto { display: none !important; }

/* Menos movimiento no es cero movimiento: se conservan los cambios de opacidad,
   que ayudan a entender qué apareció, y se quita el desplazamiento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .hora { opacity: 1; animation: none; }
}
/* ── Modo incrustado ──────────────────────────────────────────────────────────
   La portada mete esta misma página en un iframe (/agenda?incrustado=1) para
   que se pueda elegir la hora sin salir del sitio. Ahí sobra todo lo que ya
   dice la sección que la envuelve: el rótulo de marca, la bajada, el pie y el
   resplandor de fondo. Se esconde por CSS y no por JS para que no alcance a
   verse y desaparecer. El titular se queda, pero como etiqueta: la lista de
   horas necesita quien la nombre, no un segundo titular compitiendo con el de
   la sección. */
html.incrustado, html.incrustado body { min-height: 0; background: transparent; }
html.incrustado body { padding: 0; display: block; }
html.incrustado body::before { display: none; }
html.incrustado .marca,
html.incrustado .bajada,
html.incrustado #pie-nota,
html.incrustado .pie { display: none !important; }
html.incrustado .envoltorio { max-width: none; }
html.incrustado .mas-horas {
  display: block; width: 100%;
  margin-top: 6px; padding: 12px;
  background: none; border: 1px dashed var(--border-fuerte); border-radius: 12px;
  color: var(--texto-dim); font-family: var(--sans); font-size: 14px;
  cursor: pointer;
  transition: color 150ms var(--salida), border-color 150ms var(--salida);
}
html.incrustado .mas-horas:hover { color: var(--texto); border-color: var(--cian-borde); }
html.incrustado h1 {
  font-family: var(--sans);
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--texto-tenue);
  margin-bottom: 18px;
}
</style>
<script>
  /* Antes de pintar: si se decidiera abajo, con el resto del guion, el
     encabezado alcanzaría a verse y a desaparecer dentro del iframe. */
  if (/[?&]incrustado=1(?:&|$)/.test(location.search)) {
    document.documentElement.className = "incrustado";
  }
</script>
</head>
<body>
<main class="envoltorio">
  <a class="marca" href="/" id="marca" aria-label="Inicio">
    <img id="logo" alt="" width="120" height="34" hidden />
    <span id="nombre-negocio" class="nombre-negocio" hidden></span>
    <span id="rotulo">Agenda tu cita</span>
  </a>

  <div id="paso-elegir">
    <h1 id="titulo">Elige tu hora</h1>
    <p class="bajada" id="bajada">Son <strong>30 minutos</strong>, sin compromiso y sin costo. Salimos de ahí con un mapa claro de qué se puede automatizar en tu empresa y cuánto costaría.</p>
    <div id="horarios" class="cargando">Consultando la agenda…</div>
  </div>

  <div id="paso-datos" class="tarjeta oculto">
    <div class="elegida">
      <span class="elegida-hora" id="elegida-hora"></span>
      <span class="elegida-nota" id="elegida-nota"></span>
      <button type="button" class="cambiar" id="cambiar">Cambiar</button>
    </div>
    <form id="formulario" novalidate>
      <div class="campo">
        <label for="nombre" id="lbl-nombre">Tu nombre</label>
        <input id="nombre" name="nombre" autocomplete="name" required maxlength="80" placeholder="Ana Carrión" />
      </div>
      <div class="campo">
        <label for="contacto" id="lbl-contacto">Correo o WhatsApp</label>
        <input id="contacto" name="contacto" autocomplete="email" required maxlength="120" placeholder="ana@empresa.com" />
      </div>
      <div class="campo">
        <label for="empresa" id="lbl-empresa">Empresa <span style="color:var(--texto-tenue)">(opcional)</span></label>
        <input id="empresa" name="empresa" autocomplete="organization" maxlength="80" placeholder="Veterinaria Cumbayá" />
      </div>
      <div class="campo">
        <label for="motivo" id="lbl-motivo">¿Qué te gustaría resolver? <span style="color:var(--texto-tenue)">(opcional)</span></label>
        <textarea id="motivo" name="motivo" maxlength="400" placeholder="Se nos escapan mensajes de WhatsApp y agendar citas nos consume horas."></textarea>
      </div>
      <button type="submit" class="enviar" id="enviar">Confirmar mi hora</button>
      <div id="error" class="aviso oculto" role="alert"></div>
    </form>
  </div>

  <div id="paso-listo" class="listo oculto">
    <div class="listo-marca">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
    </div>
    <h2 id="listo-titulo">Listo, quedó agendada</h2>
    <p class="cuando" id="listo-cuando"></p>
    <p id="listo-detalle"></p>
  </div>

  <p id="pie-nota" style="margin-top:34px;font-size:13px;color:var(--texto-tenue);">Son 30 minutos, sin costo y sin compromiso.</p>

  <!-- Vacío en el archivo: lo llena identidad() con las vías que esta copia
       tenga configuradas. Un pie vacío es correcto; uno con el correo y el
       WhatsApp de otra empresa manda los clientes del negocio a un tercero. -->
  <footer class="pie" id="pie" style="margin-top:14px;"></footer>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var elegido = null;
  var horariosCache = [];

  /* Incrustada en la portada, la lista completa —dos semanas— mide casi dos mil
     píxeles y se come la sección que la contiene. Se enseñan los primeros días
     y el resto se despliega aquí mismo: mandar a otra página a quien quiere ver
     más horas deshace justo lo que se gana teniendo la agenda dentro. */
  var INCRUSTADA = document.documentElement.classList.contains("incrustado");
  var DIAS_AL_INICIO = 3;
  var todosLosDias = false;

  /* Dos idiomas, un solo archivo. La página en inglés enlaza aquí con ?lang=en;
     todo lo demás —los horarios, la agenda, el correo de confirmación— es el
     mismo sistema. Traducir la interfaz no es traducir el negocio. */
  var params = new URLSearchParams(location.search);
  var EN = params.get("lang") === "en";
  var T = EN
    ? {
        rotulo: "Book your appointment",
        titulo: "Pick your time",
        bajada1: "It's ", bajada2: "30 minutes", bajada3: ", no cost and no strings attached.",
        cargando: "Checking the calendar…",
        zona: "Ecuador time",
        cambiar: "Change",
        campoNombre: "Your name", campoContacto: "Email or WhatsApp",
        campoEmpresa: "Company", campoMotivo: "What would you like to solve?",
        opcional: "(optional)",
        enviar: "Confirm my time", enviando: "Booking…",
        faltaNombre: "Please write your name so we can confirm.",
        faltaContacto: "Leave us an email or a WhatsApp to confirm.",
        sinRed: "The connection dropped. Check your internet and try again.",
        errorGenerico: "We couldn't book it. Please try again.",
        ocupada: "The time you picked in the email is taken. These are still free:",
        sinAgenda: "We couldn't check the calendar right now. Write to us on ",
        sinHoras: "There are no free times in the next two weeks. Write to us on ",
        yBuscamos: " and we'll find a slot.",
        yCoordinamos: " and we'll set it up right away.",
        listoTitulo: "Done, you're booked",
        listoCorreo: function (c) { return "We sent the confirmation to " + c + ", with the invitation for your calendar."; },
        listoSinCorreo: function (c) { return "We'll write to " + c + " to confirm the details."; },
        pie: function (m) { return m + " minutes, no cost and no strings attached."; },
        masHoras: "Show more times",
      }
    : {
        rotulo: "Agenda tu cita",
        titulo: "Elige tu hora",
        bajada1: "Son ", bajada2: "30 minutos", bajada3: ", sin compromiso y sin costo.",
        cargando: "Consultando la agenda…",
        zona: "hora de Ecuador",
        cambiar: "Cambiar",
        campoNombre: "Tu nombre", campoContacto: "Correo o WhatsApp",
        campoEmpresa: "Empresa", campoMotivo: "¿Qué te gustaría resolver?",
        opcional: "(opcional)",
        enviar: "Confirmar mi hora", enviando: "Agendando…",
        faltaNombre: "Escribe tu nombre para poder confirmarte.",
        faltaContacto: "Déjanos un correo o un WhatsApp donde confirmarte.",
        sinRed: "Se cayó la conexión. Revisa tu internet e inténtalo otra vez.",
        errorGenerico: "No se pudo agendar. Inténtalo otra vez.",
        ocupada: "La hora que elegiste en el correo ya se ocupó. Estas siguen libres:",
        sinAgenda: "No pudimos consultar la agenda ahora mismo. Escríbenos por ",
        sinHoras: "No quedan horas libres en las próximas dos semanas. Escríbenos por ",
        yBuscamos: " y buscamos un espacio.",
        yCoordinamos: " y la coordinamos al momento.",
        listoTitulo: "Listo, quedó agendada",
        listoCorreo: function (c) { return "Te llegó la confirmación a " + c + ", con la invitación para tu calendario."; },
        listoSinCorreo: function (c) { return "Te escribiremos a " + c + " para confirmarte los detalles."; },
        pie: function (m) { return "Son " + m + " minutos, sin costo y sin compromiso."; },
        masHoras: "Ver más horas",
      };
  var LOCALE = EN ? "en-US" : "es-EC";

  /* Se declaran ANTES de pintar nada: el primer pintado ya los consulta, y con
     "var" la declaración se iza pero la asignación no. */
  var NEG = {};
  var duracion = 30;

  /* Pintar los textos fijos antes de que se vea nada. */
  document.documentElement.lang = EN ? "en" : "es";
  $("rotulo").textContent = T.rotulo;
  $("titulo").textContent = T.titulo;
  pintarDuracion(30);
  $("horarios").textContent = T.cargando;

  $("cambiar").textContent = T.cambiar;
  $("lbl-nombre").textContent = T.campoNombre;
  $("lbl-contacto").textContent = T.campoContacto;
  $("lbl-empresa").innerHTML = esc(T.campoEmpresa) + ' <span style="color:var(--texto-tenue)">' + esc(T.opcional) + "</span>";
  $("lbl-motivo").innerHTML = esc(T.campoMotivo) + ' <span style="color:var(--texto-tenue)">' + esc(T.opcional) + "</span>";
  $("enviar").textContent = T.enviar;
  $("listo-titulo").textContent = T.listoTitulo;

  /* El nombre del negocio no se traduce: lo pone identidad() en los dos
     idiomas. Antes había aquí un segundo literal con "Intellectum AI
     Solutions", así que corregir solo el <title> de arriba no bastaba: la
     versión ?lang=en volvía a ponerlo. */
  document.title = EN ? "Book your appointment" : "Agenda tu cita";

  /* La hora puede venir ya elegida desde un botón del correo (?h=1708-1430).
     Si para cuando abren el correo ya se ocupó, no se finge: se dice y se
     ofrecen las que sí quedan. */
  var pedida = new URLSearchParams(location.search).get("h");

  function esc(t) {
    var d = document.createElement("div");
    d.textContent = t == null ? "" : String(t);
    return d.innerHTML;
  }

  /* La API devuelve el día y la hora ya escritos en español, y además el ISO
     crudo. En inglés se reescriben aquí; así la API no tiene que saber idiomas
     y el correo —que no puede formatear nada— sigue recibiendo las palabras
     hechas. */
  function conIdioma(h) {
    if (!EN || !h.inicio) return h;
    var f = new Date(h.inicio);
    var op = { timeZone: "America/Guayaquil" };
    return {
      codigo: h.codigo,
      inicio: h.inicio,
      dia: new Intl.DateTimeFormat(LOCALE, Object.assign({ weekday: "long", day: "numeric", month: "long" }, op)).format(f),
      hora: new Intl.DateTimeFormat(LOCALE, Object.assign({ hour: "2-digit", minute: "2-digit", hour12: false }, op)).format(f),
      etiqueta: new Intl.DateTimeFormat(LOCALE, Object.assign({ weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit", hour12: false }, op)).format(f),
    };
  }

  function cargar() {
    fetch("/api/agenda")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        horariosCache = (d.horarios || []).map(conIdioma);
        if (d.duracionMinutos) {
          duracion = d.duracionMinutos;
          pintarDuracion(duracion);
        }
        pintar(horariosCache);
        if (pedida) {
          var hay = horariosCache.filter(function (h) { return h.codigo === pedida; })[0];
          if (hay) elegir(hay);
          else avisarArriba(T.ocupada);
        }
      })
      .catch(function () {
        $("horarios").className = "vacio";
        $("horarios").innerHTML = conSalida(T.sinAgenda, T.yCoordinamos);
      });
  }

  function avisarArriba(texto) {
    var p = document.createElement("p");
    p.className = "aviso";
    p.textContent = texto;
    p.style.marginTop = "18px";
    $("paso-elegir").insertBefore(p, $("horarios"));
  }

  function pintar(horarios) {
    var caja = $("horarios");
    if (!horarios.length) {
      caja.className = "vacio";
      caja.innerHTML = conSalida(T.sinHoras, T.yBuscamos);
      return;
    }

    /* Agrupadas por día: una lista de doce horas sueltas no se puede leer. */
    var porDia = [];
    horarios.forEach(function (h) {
      var grupo = porDia.filter(function (g) { return g.dia === h.dia; })[0];
      if (!grupo) { grupo = { dia: h.dia, horas: [] }; porDia.push(grupo); }
      grupo.horas.push(h);
    });

    var recorta = INCRUSTADA && !todosLosDias && porDia.length > DIAS_AL_INICIO;
    var visibles = recorta ? porDia.slice(0, DIAS_AL_INICIO) : porDia;

    var n = 0;
    caja.className = "";
    var html = visibles
      .map(function (g) {
        return (
          '<div class="dia"><div class="dia-titulo">' + esc(g.dia) + "</div><div class=\"horas\">" +
          g.horas
            .map(function (h) {
              return (
                '<button type="button" class="hora" data-codigo="' + esc(h.codigo) +
                '" aria-pressed="false" style="--i:' + n++ + '">' + esc(h.hora) + "</button>"
              );
            })
            .join("") +
          "</div></div>"
        );
      })
      .join("");
    /* El botón entra en el mismo innerHTML y no después: añadirlo aparte
       borraría los escuchadores que se enganchan justo abajo. */
    if (recorta) {
      html += '<button type="button" class="mas-horas" id="mas-horas">' + esc(T.masHoras) + "</button>";
    }
    caja.innerHTML = html;

    if (recorta) {
      $("mas-horas").addEventListener("click", function () {
        todosLosDias = true;
        pintar(horariosCache);
      });
    }

    caja.querySelectorAll(".hora").forEach(function (b) {
      b.addEventListener("click", function () {
        var h = horariosCache.filter(function (x) { return x.codigo === b.dataset.codigo; })[0];
        if (h) elegir(h);
      });
    });
  }

  function elegir(h) {
    elegido = h;
    $("elegida-hora").textContent = h.etiqueta;
    $("paso-elegir").classList.add("oculto");
    $("paso-datos").classList.remove("oculto");
    $("error").classList.add("oculto");
    /* El foco va al primer campo: quien llega por teclado no debería tener que
       buscar dónde escribir. */
    setTimeout(function () { $("nombre").focus(); }, 60);
  }

  $("cambiar").addEventListener("click", function () {
    elegido = null;
    $("paso-datos").classList.add("oculto");
    $("paso-elegir").classList.remove("oculto");
  });

  $("formulario").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!elegido) return;

    var nombre = $("nombre").value.trim();
    var contacto = $("contacto").value.trim();
    if (!nombre) return mostrarError(T.faltaNombre);
    if (!contacto) return mostrarError(T.faltaContacto);

    var boton = $("enviar");
    boton.disabled = true;
    boton.textContent = T.enviando;
    $("error").classList.add("oculto");

    fetch("/api/agenda", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        codigo: elegido.codigo,
        nombre: nombre,
        contacto: contacto,
        empresa: $("empresa").value.trim(),
        motivo: $("motivo").value.trim(),
      }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          boton.disabled = false;
          boton.textContent = T.enviar;
          mostrarError(res.d.error || T.errorGenerico);
          if (res.d.recargar) {
            $("paso-datos").classList.add("oculto");
            $("paso-elegir").classList.remove("oculto");
            $("horarios").className = "cargando";
            $("horarios").textContent = T.cargando;
            elegido = null;
            cargar();
          }
          return;
        }
        $("paso-datos").classList.add("oculto");
        $("listo-cuando").textContent = elegido ? elegido.etiqueta : res.d.cuando;
        $("listo-detalle").textContent = res.d.correoLlego
          ? T.listoCorreo(res.d.contacto)
          : T.listoSinCorreo(res.d.contacto);
        $("paso-listo").classList.remove("oculto");
        /* Reserva confirmada de verdad, no "le dio al botón". Es el único
           momento de toda la web en que alguien pasa de curioso a cita en la
           agenda, así que es el que la pauta tiene que aprender a buscar.
           Si el visitante no dio permiso para medir, medir() no hace nada. */
        if (window.medir) window.medir("Schedule", { canal: "web" });
      })
      .catch(function () {
        boton.disabled = false;
        boton.textContent = T.enviar;
        mostrarError(T.sinRed);
      });
  });

  function mostrarError(texto) {
    $("error").textContent = texto;
    $("error").classList.remove("oculto");
  }

  /* DE QUIÉN ES ESTA COPIA.
     El HTML no lo sabe (es el mismo archivo en todos los despliegues), así que
     se lo pregunta al servidor. Mientras no conteste, la página no dice ningún
     nombre ni reparte ningún contacto: en una copia ajena, equivocarse aquí es
     mandarle los clientes de un negocio a otro. */

  function identidad() {
    return fetch("/api/negocio")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        NEG = d || {};

        /* El rótulo del negocio, en el idioma que se está viendo. Sin la
           versión inglesa se pisaba el "Free consultation" recién pintado con
           el "Consultoría gratuita" que llega del servidor, a media página. */
        var rotulo = EN ? NEG.citaTituloEn : NEG.citaTitulo;
        var titulo = rotulo || (EN ? "Book your appointment" : T.rotulo);
        document.title = NEG.nombre ? titulo + " — " + NEG.nombre : titulo;
        if (NEG.nombre) $("marca").setAttribute("aria-label", NEG.nombre);
        if (rotulo) $("rotulo").textContent = rotulo;
        pintarDuracion(duracion);

        /* Con logo se pinta el logo; sin logo, el nombre en letra. Nunca el
           logotipo de otra empresa encabezando este formulario. */
        if (NEG.logo) {
          $("logo").src = NEG.logo;
          $("logo").hidden = false;
        } else if (NEG.nombre) {
          $("nombre-negocio").textContent = NEG.nombre;
          $("nombre-negocio").hidden = false;
        }

        pintarPie();
      })
      .catch(function () {
        /* Sin identidad no se inventa ninguna: la página queda neutra y la
           agenda funciona igual, que es lo que la persona vino a hacer. */
      });
  }

  /* La duración de la cita la manda /api/agenda; hasta que conteste se dice
     media hora, que es lo que dura por defecto. La frase de qué se lleva la
     persona ("salimos de ahí con un mapa de...") es una promesa comercial, así
     que solo aparece si ESTE negocio la configuró. */
  function pintarDuracion(minutos) {
    var m = Number(minutos) || 30;
    var unidad = EN ? " minutes" : " minutos";
    /* Cada idioma con la suya. Pegar aquí la española debajo de la inglesa
       dejaba la misma promesa dos veces, la segunda en otro idioma. */
    var promesa = EN ? NEG.citaDescripcionEn : NEG.citaDescripcion;
    var extra = promesa ? " " + promesa : "";
    $("bajada").innerHTML =
      esc(T.bajada1) + "<strong>" + esc(m + unidad) + "</strong>" + esc(T.bajada3 + extra);
    $("pie-nota").textContent = T.pie(m);
    $("elegida-nota").textContent = T.zona + " · " + m + (EN ? " min" : " min");
  }

  function pintarPie() {
    var pie = $("pie");
    var partes = [];
    if (NEG.correo) partes.push('<a href="mailto:' + esc(NEG.correo) + '">' + esc(NEG.correo) + "</a>");
    if (NEG.enlaceWhatsapp && NEG.whatsappBot) {
      partes.push('<a href="' + esc(NEG.enlaceWhatsapp) + '">WhatsApp ' + esc(NEG.whatsappBot) + "</a>");
    }
    /* NEG.web es el dominio como el negocio lo escribe ("intellectum.ec");
       NEG.dominio sale de SITIO_URL y trae el www. Se prefiere el primero. */
    var casa = NEG.web || NEG.dominio;
    if (casa) partes.push('<a href="/">' + esc(casa) + "</a>");
    pie.innerHTML = partes.join("");
  }

  /* Un aviso de error con su salida por WhatsApp, si esta copia tiene una.
     Si no la tiene, la frase se corta antes del "escríbenos por": es el
     momento en que la persona más necesita el canal correcto, y darle el de
     otra empresa es peor que no darle ninguno. */
  function conSalida(antes, despues) {
    if (!NEG.enlaceWhatsapp) return esc(antes.replace(/\s*Escríbenos por\s*$/i, "").replace(/\s*Write to us on\s*$/i, ""));
    return (
      esc(antes) +
      '<a href="' + esc(NEG.enlaceWhatsapp) + '" style="color:var(--cian-claro)">WhatsApp</a>' +
      esc(despues)
    );
  }

  /* Modo incrustado: la portada no puede medir por fuera el alto de un iframe,
     así que se lo decimos nosotros cada vez que cambia —al llegar los horarios,
     al desplegar más días, al pasar al formulario, al confirmar—.

     Dos medidas y se toma la mayor, porque cada una falla por un lado. El
     scrollHeight del DOCUMENTO nunca baja del alto del propio iframe: el marco
     podría crecer pero jamás encoger, y se quedaría con el hueco del paso más
     largo. El del CUERPO sí encoge, pero se come el margen inferior del último
     hijo cuando colapsa: son 31 px que recortan el botón de confirmar. El
     borde de abajo del envoltorio no miente en ninguno de los dos casos. */
  if (INCRUSTADA && parent !== window) {
    var envoltorio = document.querySelector(".envoltorio");
    var avisarAlto = function () {
      var alto = document.body.scrollHeight;
      if (envoltorio) alto = Math.max(alto, Math.ceil(envoltorio.getBoundingClientRect().bottom));
      parent.postMessage({ agenda: "alto", alto: alto }, location.origin);
    };

    /* Dos vigilantes, porque cada uno ve lo que el otro no. El de mutaciones
       cubre los cambios que hace esta página —pintar horarios, cambiar de
       paso, mostrar un error— y dispara aunque la pestaña esté en segundo
       plano. El de tamaño cubre lo que no pasa por el DOM: una tipografía que
       llega tarde, el giro del teléfono, el teclado que se abre. Con el de
       tamaño solo, el marco se quedaba corto y recortaba el último botón. */
    var pendiente = 0;
    var avisarPronto = function () {
      clearTimeout(pendiente);
      pendiente = setTimeout(avisarAlto, 40);
    };
    new MutationObserver(avisarPronto).observe(document.body, {
      childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"],
    });
    if (window.ResizeObserver) new ResizeObserver(avisarPronto).observe(document.body);
    window.addEventListener("load", avisarAlto);
    avisarAlto();
  }

  identidad().then(cargar);
})();
</script>
  <script src="/medicion.js" defer></script>
</body>
</html>
