<meta charset="utf-8" />
  <!-- Verificación de dominio de Meta. Demuestra que intellectum.ec es nuestro,
       y sin ella Meta no atribuye las conversiones de quien entra desde un
       iPhone. No se borra aunque parezca inerte: si desaparece, la
       verificación se cae y con ella la medición de la pauta. -->
  <meta name="facebook-domain-verification" content="9xfwj09xamrs3694cjhthfj1xqqax5" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />

<!-- Título y descripción NEUTROS a propósito, igual que en agenda.html. Este
     archivo viaja idéntico a todas las copias: lo que diga aquí lo va a leer
     también el cliente que publique la suya, y lo leen los rastreadores y las
     vistas previas de WhatsApp y Facebook ANTES de que corra ningún JS. Antes
     decía "Intellectum AI Solutions", así que la ferretería que compartía su
     enlace de chat mostraba una vista previa con el nombre de Intellectum.
     El nombre real lo pone identidad() con lo que responde /api/negocio: sirve
     para la pestaña y para Google, que sí ejecuta el JS. -->
<title>Habla con nuestro asistente</title>
<meta name="description" content="Escribe tu consulta y te respondemos al instante, las 24 horas." />
<meta name="robots" content="index, follow" />
<!-- Canonical RELATIVO a propósito: así cada copia se canoniza a su propio
     dominio. Con la dirección absoluta, la copia de otro negocio le decía a
     Google que su página de chat era en realidad la de intellectum.ec. -->
<link rel="canonical" href="/chat" />

<!-- Lo mismo para la vista previa al compartir el enlace: neutra en el archivo,
     y la completa el JS con el negocio de esta copia. og:site_name se fue: era
     el dato que más delataba, porque WhatsApp lo muestra en negrita. -->
<meta property="og:type" content="website" />
<meta property="og:title" id="og-titulo" content="Habla con nuestro asistente" />
<meta property="og:description" id="og-descripcion" content="Escribe tu consulta y te respondemos al instante, las 24 horas." />
<meta property="og:image" content="/og.png" />
<meta property="og:locale" content="es_EC" />

<!-- Aquí había un bloque de datos estructurados (JSON-LD) que decía, con la
     dirección escrita a mano, que esta página era https://www.intellectum.ec/chat
     y que pertenecía al sitio y a la organización Intellectum. En la copia de
     otro negocio eso es sencillamente falso: le declaraba a Google que su chat
     era una página de intellectum.ec. Se quitó. La ficha de organización sigue
     donde corresponde, en la portada de cada sitio, y esta página se identifica
     sola con el canonical relativo de arriba. -->

<style>
/* El atributo hidden vale menos que cualquier regla de display, y esta página
   lo usa para esconder lo que la copia no tiene configurado (el logo, el botón
   de WhatsApp, las preguntas sugeridas). Sin esto, el hueco se sigue viendo. */
[hidden] { display: none !important; }

/* Mismo mundo visual que la portada (ver DESIGN.md): oscuro #08090b, cian de
   marca, Fraunces solo como acento. */
:root {
  --bg: #08090b;
  --bg-elev: #0d0f12;
  --bg-card: rgba(255, 255, 255, 0.02);
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.15);
  --text: #f7f8f8;
  --text-dim: #a6adb0;
  --text-muted: #737d81;
  --accent: #22d3ee;
  --accent-bright: #67e8f9;
  --accent-glow: rgba(34, 211, 238, 0.22);
  --accent-tint-bg: rgba(34, 211, 238, 0.08);
  --accent-tint-border: rgba(34, 211, 238, 0.24);
  --whatsapp: #25d366;
  --font-display: "Fraunces", "Times New Roman", serif;
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 12px;
  --radius-lg: 18px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease: var(--ease-out);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  height: 100dvh;
  overflow: hidden;
  caret-color: var(--accent);
  accent-color: var(--accent);
}
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
textarea { font: inherit; color: inherit; }

/* Las superficies del navegador también llevan el diseño. */
::selection { background: var(--accent); color: #06141a; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
html { scrollbar-color: rgba(255, 255, 255, 0.14) transparent; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34, 211, 238, 0.05), transparent 60%);
}

/* CABECERA */
.top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px clamp(16px, 3vw, 32px);
  background: rgba(8, 9, 11, 0.75);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
}
.brand { display: inline-flex; align-items: center; gap: 11px; }
.brand img { height: 28px; width: auto; }
.brand-text {
  font-family: var(--font-display);
  font-size: 19px;
  letter-spacing: -0.02em;
}
.top-spacer { flex: 1; }
.volver {
  font-size: 14px;
  color: var(--text-dim);
  transition: color 0.25s var(--ease);
  white-space: nowrap;
}
.volver:hover { color: var(--text); }
.btn-wa {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--whatsapp);
  color: #fff;
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  transition: transform 160ms var(--ease-out), background 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.btn-wa:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .btn-wa:hover { background: #1fb858; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(37, 211, 102, 0.25); }
}
.btn-wa svg { width: 17px; height: 17px; flex: none; }
@media (max-width: 560px) {
  .btn-wa span { display: none; }
  .btn-wa { padding: 10px 12px; }
  .volver { display: none; }
}

/* LIENZO DEL CHAT */
.chatpage {
  position: relative;
  z-index: 1;
  height: 100dvh;
  padding-top: 62px;
  display: flex;
  flex-direction: column;
}
.log {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
}
.log-inner {
  max-width: 780px;
  margin: 0 auto;
  padding: 28px clamp(16px, 3vw, 32px) 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100%;
}

/* PORTADA (estado vacío) */
.portada { margin: auto 0; padding: 24px 0 12px; text-align: left; }
/* El mismo chip vivo de la portada: aquí es el estado real del asistente. */
.chip-live {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--accent-tint-border);
  background: var(--accent-tint-bg);
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.01em;
}
.chip-live strong { color: var(--text); font-weight: 500; }
.chip-live .vivo {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: latido 2.4s infinite;
}
@keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.portada h1 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.05;
  font-size: clamp(34px, 6vw, 56px);
  margin: 18px 0 14px;
  text-wrap: balance;
}
.portada h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.portada .sub {
  max-width: 560px;
  color: var(--text-dim);
  font-size: clamp(15px, 1.6vw, 17px);
  margin: 0 0 26px;
}
.chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
  max-width: 640px;
}
.chip {
  text-align: left;
  padding: 13px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.4;
  transition: border-color 200ms var(--ease-out), color 200ms var(--ease-out), background 200ms var(--ease-out), transform 160ms var(--ease-out);
}
.chip:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--accent-tint-border);
    background: var(--accent-tint-bg);
    color: var(--text);
    transform: translateY(-1px);
  }
}

/* BURBUJAS */
.msg {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-size: 15px;
  line-height: 1.55;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
}
.msg.yo {
  align-self: flex-end;
  background: var(--accent-tint-bg);
  border: 1px solid var(--accent-tint-border);
  border-bottom-right-radius: 6px;
}
.msg.aviso {
  align-self: center;
  max-width: 100%;
  text-align: center;
  background: none;
  border: none;
  padding: 2px 0;
  color: var(--text-muted);
  font-size: 13px;
}
.msg a { color: var(--accent); }
@media (max-width: 560px) { .msg { max-width: 90%; } }

.puntos { display: inline-flex; gap: 4px; align-items: center; height: 12px; }
.puntos i {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text-muted);
  animation: pulso 1.3s infinite;
}
.puntos i:nth-child(2) { animation-delay: 0.18s; }
.puntos i:nth-child(3) { animation-delay: 0.36s; }
@keyframes pulso {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* COMPOSITOR */
.pie {
  position: relative;
  z-index: 2;
  border-top: 1px solid var(--border);
  background: rgba(13, 15, 18, 0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.pie-inner {
  max-width: 780px;
  margin: 0 auto;
  padding: 12px clamp(16px, 3vw, 32px) calc(10px + env(safe-area-inset-bottom));
}
.fila { display: flex; gap: 10px; align-items: flex-end; }
.entrada {
  flex: 1;
  resize: none;
  max-height: 140px;
  padding: 13px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
}
.entrada::placeholder { color: var(--text-muted); }
.entrada:focus { outline: none; border-color: var(--accent); }
.enviar {
  flex: none;
  width: 46px; height: 46px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #04222a;
  display: grid;
  place-items: center;
  transition: transform 160ms var(--ease-out), background 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.enviar:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) {
  .enviar:hover { background: var(--accent-bright); box-shadow: 0 6px 24px var(--accent-glow); }
}
.enviar:disabled { opacity: 0.4; cursor: default; box-shadow: none; transform: none; }
.enviar:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
.enviar svg { width: 18px; height: 18px; }
.legal {
  margin: 9px 2px 0;
  font-size: 11px;
  line-height: 1.4;
  color: var(--text-muted);
  text-align: center;
}
.legal a { color: var(--text-dim); text-decoration: underline; text-underline-offset: 2px; }
.legal a:hover { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .log { scroll-behavior: auto; }
  .puntos i, .chip-live .vivo { animation: none; opacity: 0.6; }
  .btn-wa, .chip, .volver, .enviar { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <!-- Sin identidad escrita a mano: la pone identidad() con lo que responde
       /api/negocio. Este archivo es el mismo en todas las copias. -->
  <a href="/" class="brand" id="brand" aria-label="Volver al inicio">

  <div class="top-spacer"></div>
  <a href="/" class="volver">← Volver al sitio</a>
  <a href="#" id="btn-wa"
     class="btn-wa" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0 0 20.464 3.488"/></svg>

<main class="chatpage">
  <div class="log" id="log" role="log" aria-live="polite" aria-atomic="false">
    <div class="log-inner" id="logInner">

      <div class="portada" id="portada">
        <span class="chip-live"><span class="vivo" aria-hidden="true"></span><strong>En línea</strong> · te responde ahora mismo</span>

<script>
(function () {
  "use strict";

  var ENDPOINT = "/api/chat";
  var MAX_HISTORIAL = 30;
  var CLAVE_SESION = "iachat_sesion";
  var CLAVE_HISTORIAL = "iachat_historial";

  var log = document.getElementById("log");
  var logInner = document.getElementById("logInner");
  var portada = document.getElementById("portada");
  var chips = document.getElementById("chips");
  var entrada = document.getElementById("entrada");
  var botonEnviar = document.getElementById("enviar");

  var enviando = false;
  var sesion = obtenerSesion();
  var historial = cargarHistorial();

  /* DE QUIÉN ES ESTA COPIA.
     Esta página es un archivo estático: viaja idéntica a todos los despliegues,
     así que no puede llevar escrito el nombre, el logo ni el contacto de nadie.
     Se los pregunta al servidor, que sí sabe para qué negocio se publicó. */
  var NEG = {};

  function identidad() {
    return fetch("/api/negocio")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        NEG = d || {};

        if (NEG.nombre) {
          var tituloPagina = (NEG.agente ? "Habla con " + NEG.agente + " — " : "") + NEG.nombre;
          document.title = tituloPagina;
          document.getElementById("brand").setAttribute("aria-label", NEG.nombre + " — Volver al inicio");

          /* La pestaña, la descripción y la vista previa quedan con el nombre de
             este negocio. En el archivo son neutras a propósito (ver el head), y
             esto las completa. Google ejecuta el JS y lee lo de aquí; WhatsApp y
             Facebook NO, así que ellos se quedan con la versión neutra: preferimos
             una vista previa genérica antes que una con el nombre de otro. */
          var descripcion = (NEG.agente ? "Habla con " + NEG.agente + ", el asistente de " + NEG.nombreCorto + ". " : "") +
            "Te responde al instante, las 24 horas.";
          var metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc) metaDesc.setAttribute("content", descripcion);
          var ogT = document.getElementById("og-titulo");
          if (ogT) ogT.setAttribute("content", tituloPagina);
          var ogD = document.getElementById("og-descripcion");
          if (ogD) ogD.setAttribute("content", descripcion);
        }
        if (NEG.nombreCorto) document.getElementById("brand-text").textContent = NEG.nombreCorto;

        if (NEG.logo) {
          var img = document.getElementById("logo");
          img.src = NEG.logo;
          img.hidden = false;
        }

        /* El botón de WhatsApp de la cabecera y el del pie: si esta copia no
           tiene número, no se muestran. Un botón que abre el chat de otra
           empresa es peor que no tener botón. */
        if (NEG.enlaceWhatsapp) {
          var saludo = NEG.nombreCorto ? "Hola " + NEG.nombreCorto + ", quiero más información" : "Hola, quiero más información";
          var btn = document.getElementById("btn-wa");
          btn.href = NEG.enlaceWhatsapp + "?text=" + encodeURIComponent(saludo);
          btn.hidden = false;

          document.getElementById("legal-wa-enlace").href = NEG.enlaceWhatsapp;
          document.getElementById("legal-wa").hidden = false;
        }

        var titulo = document.getElementById("portada-titulo");
        if (titulo && NEG.agente) titulo.innerHTML = "Habla con <em>" + escapar(NEG.agente) + ".</em>";

        var sub = document.getElementById("portada-sub");
        if (sub && (NEG.nombreCorto || NEG.chatIntro)) {
          sub.textContent =
            (NEG.nombreCorto ? "Soy el asistente de " + NEG.nombreCorto + ". " : "") + (NEG.chatIntro || "");
        }

        pintarChips();
      })
      .catch(function () {
        /* Sin respuesta no se inventa ninguna identidad: la página queda
           neutra y el chat funciona igual, que es a lo que vino la persona. */
      });
  }

  function pintarChips() {
    var lista = NEG.chips || [];
    if (!lista.length) return;
    lista.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = t;
      chips.appendChild(b);
    });
    chips.hidden = false;
  }

  function escapar(t) {
    var d = document.createElement("div");
    d.textContent = t == null ? "" : String(t);
    return d.innerHTML;
  }

  /* Cómo se llama aquí a la cita, con lo que diga este negocio. */
  function unaCita() {
    return NEG.cita || "una cita";
  }
  function elEvento() {
    return NEG.evento || "cita";
  }

  /* La cola de un mensaje de error, con las vías que esta copia tenga. Si no
     tiene ninguna, no se añade nada: es el momento en que la persona más
     necesita el canal correcto, y darle el de otra empresa es lo peor. */
  function colaDeContacto() {
    var vias = [];
    if (NEG.whatsappBot) vias.push("al WhatsApp " + NEG.whatsappBot);
    if (NEG.correo) vias.push("a " + NEG.correo);
    if (!vias.length) return "";
    return "\n\nSi es urgente, escríbenos " + vias.join(" o ") + ".";
  }

  // Si la persona ya venía conversando (p. ej. recargó la página), se repinta todo.
  if (historial.length) {
    portada.remove();
    historial.forEach(function (m) {
      pintar(m.role === "user" ? "yo" : "bot", m.content);
    });
    abajo(true);
  }

  chips.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) enviar(chip.textContent.trim());
  });

  botonEnviar.addEventListener("click", function () { enviar(entrada.value); });

  entrada.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviar(entrada.value);
    }
  });
  entrada.addEventListener("input", function () {
    entrada.style.height = "auto";
    entrada.style.height = Math.min(entrada.scrollHeight, 140) + "px";
  });
  entrada.focus();

  identidad().then(arrancarPorIntencion);

  /* Si llegan desde un aviso de cancelación (?intencion=reagendar) o desde un
     botón de agendar (?intencion=agendar), la conversación arranca sola
     pidiendo las fechas disponibles: nadie debería teclear para eso. */
  function arrancarPorIntencion() {
    var params = new URLSearchParams(location.search);
    var intencion = params.get("intencion");
    if (!intencion || enviando) return;
    /* La referencia viene en el enlace del correo de la cita, para que nadie
       tenga que entender ni teclear un código. Se limpia a letras y números
       porque va directa al mensaje que se envía. */
    var cita = (params.get("cita") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 24);
    var arranques = {
      reagendar: "Hola, me avisaron que mi cita quedó cancelada, así que necesito agendar una nueva. ¿Qué fechas tienes disponibles?",
      agendar: "Hola, quiero agendar " + unaCita() + ". ¿Qué fechas tienes disponibles?",
      mover: cita
        ? "Hola, necesito mover o cancelar mi " + elEvento() + ". La referencia de mi cita es " + cita + "."
        : "Hola, necesito mover o cancelar mi " + elEvento() + ".",
    };
    var mensaje = arranques[intencion];
    if (!mensaje) return;
    // Sin repetir si la persona recarga la página con el mismo enlace.
    history.replaceState(null, "", location.pathname);
    enviar(mensaje);
  }

  /* ------------------------------------------------------------ conversación */

  function limpiar(texto) {
    return texto
      .replace(/\*\*(.+?)\*\*/g, "$1")
      .replace(/__(.+?)__/g, "$1")
      .replace(/^#{1,6}\s+/gm, "");
  }

  function pintar(quien, texto) {
    var burbuja = document.createElement("div");
    burbuja.className = "msg " + (quien === "yo" ? "yo" : quien === "aviso" ? "aviso" : "bot");
    burbuja.textContent = quien === "yo" ? texto : limpiar(texto);
    logInner.appendChild(burbuja);
    abajo();
    return burbuja;
  }

  function abajo(instante) {
    if (instante) log.style.scrollBehavior = "auto";
    log.scrollTop = log.scrollHeight;
    if (instante) log.style.scrollBehavior = "";
  }

  var anotadoElPrimerMensaje = false;

  function enviar(texto) {
    texto = (texto || "").trim();
    if (!texto || enviando) return;

    if (portada.isConnected) portada.remove();
    entrada.value = "";
    entrada.style.height = "auto";

    // El primer mensaje que ESCRIBE la persona, no el hecho de llegar a esta
    // página. Abrir el chat y no decir nada es curiosidad; escribir es
    // intención, y es lo que la pauta tiene que aprender a buscar. Solo el
    // primero: una conversación de quince mensajes es una intención, no quince.
    if (!anotadoElPrimerMensaje) {
      anotadoElPrimerMensaje = true;
      if (window.medir) window.medir("Contact", { canal: "chat_web" });
    }

    pintar("yo", texto);
    historial.push({ role: "user", content: texto });
    if (historial.length > MAX_HISTORIAL) historial = historial.slice(-MAX_HISTORIAL);
    guardarHistorial();

    conversar();
  }

  function conversar() {
    enviando = true;
    botonEnviar.disabled = true;

    var burbuja = document.createElement("div");
    burbuja.className = "msg bot";
    burbuja.innerHTML = '<span class="puntos"><i></i><i></i><i></i></span>';
    logInner.appendChild(burbuja);
    abajo();

    var acumulado = "";
    var primero = true;

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: historial, sessionId: sesion }),
    })
      .then(function (res) {
        if (!res.ok || !res.body) {
          return res
            .json()
            .catch(function () { return {}; })
            .then(function (datos) {
              throw new Error(datos.error || "No se pudo conectar con el asistente.");
            });
        }

        var lector = res.body.getReader();
        var decodificador = new TextDecoder();
        var buffer = "";

        function leer() {
          return lector.read().then(function (resultado) {
            if (resultado.done) return;
            buffer += decodificador.decode(resultado.value, { stream: true });

            var partes = buffer.split("\n\n");
            buffer = partes.pop();

            partes.forEach(function (parte) {
              var linea = parte.trim();
              if (linea.indexOf("data:") !== 0) return;
              var evento;
              try {
                evento = JSON.parse(linea.slice(5).trim());
              } catch (e) {
                return;
              }

              if (evento.t === "delta" || evento.t === "error") {
                if (primero) {
                  burbuja.textContent = "";
                  primero = false;
                }
                acumulado += (evento.t === "error" && acumulado ? "\n\n" : "") + evento.v;
                burbuja.textContent = limpiar(acumulado);
                abajo();
              }
            });

            return leer();
          });
        }

        return leer();
      })
      .then(function () {
        if (acumulado) {
          historial.push({ role: "assistant", content: acumulado });
          guardarHistorial();
        } else {
          burbuja.remove();
          pintar("aviso", "No llegó respuesta. Intenta otra vez, por favor.");
        }
      })
      .catch(function (err) {
        burbuja.remove();
        pintar(
          "bot",
          (err && err.message ? err.message : "Se cayó la conexión.") + colaDeContacto(),
        );
      })
      .then(function () {
        enviando = false;
        botonEnviar.disabled = false;
        entrada.focus();
      });
  }

  /* ------------------------------------------------------------------ sesión */

  /* La sesión vive en localStorage, no en sessionStorage: es la llave con la
     que el servidor recuerda a la persona (su lead, su cotización, su cita).
     Guardarla en sessionStorage la mataba al cerrar la pestaña y el visitante
     que volvía al día siguiente era un desconocido. El historial visible sí
     es de la visita; la memoria de la relación la pone el servidor. */
  function obtenerSesion() {
    try {
      var guardada = localStorage.getItem(CLAVE_SESION);
      if (!guardada) {
        // Quien esté a mitad de conversación conserva su sesión de antes.
        guardada = sessionStorage.getItem(CLAVE_SESION);
        if (guardada) localStorage.setItem(CLAVE_SESION, guardada);
      }
      if (guardada) return guardada;
      var nueva = "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(CLAVE_SESION, nueva);
      return nueva;
    } catch (e) {
      return "s_" + Date.now().toString(36);
    }
  }

  function cargarHistorial() {
    try {
      var crudo = sessionStorage.getItem(CLAVE_HISTORIAL);
      var lista = crudo ? JSON.parse(crudo) : [];
      return Array.isArray(lista) ? lista.slice(-MAX_HISTORIAL) : [];
    } catch (e) {
      return [];
    }
  }

  function guardarHistorial() {
    try {
      sessionStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(historial));
    } catch (e) { /* sin espacio o modo privado: no pasa nada */ }
  }
})();
</script>
